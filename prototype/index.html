<title>Cueue Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header + board (7 day columns in landscape, one day in portrait) + demo clock bar.
   Card color = what the card needs from you: Now (indigo), Due today (amber), Late (red), Break (green), Waiting (grey). */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#172033; --muted:#5D667A; --line:#D8DDE7;
  --accent:#3B55F0; --accent-soft:#E3E8FE; --accent-ink:#FFFFFF;
  --work:#0F8B8D; --home:#D9702A; --ok:#169A63; --warn:#D99A0B; --hot:#E0434A; --rest:#1E9E6A;
  --event-bg:#E2E6EE; --event-ink:#4A5366; --pie-track:#E6E9F0; --scrim:rgba(15,20,32,.45); --flare:rgba(255,255,255,.75);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --amp:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F;
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); --flare:rgba(255,255,255,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F;
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); --flare:rgba(255,255,255,.22); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.rest{background:var(--rest);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-bottom:1px solid var(--line);font-size:14px}

/* Board */
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{flex:1 0 230px;min-width:0;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;min-height:0}
.col.today{flex-basis:320px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.board.single .col{flex:1 1 auto;max-width:640px;margin-inline:auto}
.col.past{opacity:.75}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.colhead .date{color:var(--muted);font-size:13px;font-weight:500}
.colhead .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.colhead .nav{display:flex;gap:4px}
.colbody{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.colbody > *{flex-shrink:0}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dayprog{margin-top:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dayprog .row{display:flex;justify-content:space-between;color:var(--muted)}
.dayprog .row b{color:var(--ink)}

/* Progress bars */
.bar{height:8px;border-radius:999px;background:var(--pie-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s ease}
.bar.thin{height:4px}

/* Big panels: Now / Break / Start my day */
.panel{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.panel.restp{border-color:var(--rest);background:color-mix(in srgb,var(--rest) 10%,var(--surface))}
.panel.latep{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 7%,var(--surface))}
.panel .ph{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.panel .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--accent)}
.panel.restp .tag{color:var(--rest)} .panel.latep .tag{color:var(--hot)}
.panel h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.panel .main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.panel .words{font-weight:600}
.panel .sub{font-size:13px;color:var(--muted);line-height:1.4}
.panel .row{display:flex;gap:6px;flex-wrap:wrap}
.panel .steps li{padding:4px 2px}
.panel .steps li.nextup{background:var(--surface);border-radius:8px;padding:6px 6px;font-weight:600}
.checkin{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.brkopt{border:1px solid color-mix(in srgb,var(--rest) 40%,var(--line));background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.brkopt b{font-size:14px} .brkopt span{font-size:12px;color:var(--muted)}
.brkopt.star{border-color:var(--rest);box-shadow:0 0 0 2px color-mix(in srgb,var(--rest) 30%,transparent)}

/* Cards */
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 0 12px;cursor:pointer;
  transition:opacity .6s ease, box-shadow .3s ease;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card.s-due{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.card.s-late{background:color-mix(in srgb,var(--hot) 10%,var(--surface))}
.card.s-wait{background:var(--surface-2);border-style:dashed}
.card .top{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card .time{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.ctx{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.ctx::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ctx.work{color:var(--work)} .ctx.home{color:var(--home)}
.diff{margin-left:auto;display:inline-flex;gap:2px}
.diff i{width:5px;height:10px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--ink)}
.card .title{font-weight:700;line-height:1.25;font-size:15px;min-width:0;overflow-wrap:anywhere}
.card .next{grid-column:1/2;font-size:13.5px;color:var(--muted);line-height:1.3;min-width:0;overflow-wrap:anywhere}
.card .next b{color:var(--ink);font-weight:600}
.card .meta{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.card .meta svg{width:14px;height:14px}
.card .prog{grid-column:1/-1;margin:8px -10px 0 -12px;height:4px;background:var(--pie-track)}
.card .prog i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.hot{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.check{grid-row:2/4;grid-column:2;align-self:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .15s}
.check:hover{border-color:var(--ok);transform:scale(1.08)}
.check svg{width:16px;height:16px;color:var(--ok);opacity:0}
.check:hover svg{opacity:.6}
.locked .check{border-style:dashed}
.card.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.2}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}

/* Pie timer */
.pie{--p:0;--fill:var(--hot);width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--fill) calc(var(--p)*1turn),var(--pie-track) 0);flex:none}
.pie.big{width:96px;height:96px}
.pie.rest{--fill:var(--rest)}
.pie.over{box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 45%,transparent)}
.pie.off{display:none}

/* Event + prep + planned break */
.event{background:var(--event-bg);color:var(--event-ink);border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:pointer}
.event .time{font-family:var(--font-mono);font-size:11px}
.event b{display:block;color:var(--ink);font-weight:600}
.event.pastev{opacity:.55}
.prep{background:transparent;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink)}
.prep .tag{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.brkcard{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;cursor:pointer;
  background:color-mix(in srgb,var(--rest) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--rest) 55%,var(--line));text-align:left}
.brkcard svg{width:20px;height:20px;color:var(--rest);flex:none}
.brkcard b{display:block;font-size:14px}
.brkcard span{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px}

/* Cue levels: glow, periodic shake, light flare sweep */
.card.lvl-1{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent)}
.card.lvl-2{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 65%,transparent)}
.card.lvl-3{box-shadow:0 0 0 2px color-mix(in srgb,var(--hot) 65%,transparent)}
.card.lvl-4{box-shadow:0 0 0 3px var(--hot)}
.motion .card.lvl-2{animation:shake 5s ease-in-out infinite}
.motion .card.lvl-3{animation:shake 3s ease-in-out infinite;--k:1.6}
.motion .card.lvl-4{animation:shake 1.8s ease-in-out infinite;--k:2.4}
.card::after,.panel.flare::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:45%;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 0%,var(--flare) 45%,rgba(255,255,255,0) 55%,transparent 100%);transform:translateX(-150%) skewX(-12deg)}
.flare-on .card.lvl-2::after{opacity:1;animation:flare 5s ease-in-out .9s infinite}
.flare-on .card.lvl-3::after{opacity:1;animation:flare 3s ease-in-out .7s infinite}
.flare-on .card.lvl-4::after{opacity:1;animation:flare 1.8s ease-in-out .5s infinite}
.panel{position:relative;overflow:hidden}
.flare-on .panel.flare::after{opacity:1;animation:flare 4s ease-in-out infinite}
@keyframes flare{0%{transform:translateX(-150%) skewX(-12deg)}22%,100%{transform:translateX(330%) skewX(-12deg)}}
@keyframes shake{
  0%,14%,100%{transform:translateX(0) rotate(0)}
  2%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.6deg)}
  4%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.6deg)}
  6%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.4deg)}
  8%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.4deg)}
  10%{transform:translateX(calc(var(--amp)*var(--k,1)*-.5))}
}

/* Demo clock bar */
.simbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line);font-size:13px}
.simbar .clock{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;font-weight:500}
.simbar .tagline{color:var(--muted)}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;background:none;border:0;padding:0;text-align:left}
button.crumb:hover{color:var(--accent);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.steps li.done .t{color:var(--muted);text-decoration:line-through}
.steps input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.steps label{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.stype{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.when{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
details.donesteps{margin-top:8px}
details.donesteps summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;padding:4px 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.quote{background:var(--surface-2);border-left:3px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--muted)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13.5px}
.sw{width:28px;height:18px;border-radius:6px;border:1px solid var(--line)}
a{color:var(--accent)}

/* Goals tree */
.goal{border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.goal > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr 80px 38px;gap:8px;align-items:center;padding:6px 0}
.goal > summary::-webkit-details-marker{display:none}
.goal > summary::before{content:"▸";color:var(--muted);transition:transform .2s}
.goal[open] > summary::before{transform:rotate(90deg)}
.goal .gt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.goal .pct{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gbody{padding-left:14px}
.gtask{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;margin:4px 0;font-size:14px}
.gtask span{color:var(--muted);font-size:12px;white-space:nowrap}
.gtask.isdone{opacity:.65}

/* Toasts + confetti */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:up .25s ease}
.toast small{display:block;font-weight:500;opacity:.8}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){.card,.sheet,.toast{animation:none!important}}
</style>

<div class="app" id="app">
  <header>
    <div class="brand">Cueue <small>prototype</small></div>
    <div class="seg" role="group" aria-label="Focus">
      <button data-focus="all">All</button><button data-focus="work">Work</button><button data-focus="home">Home</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button data-view="auto">Auto</button><button data-view="week">Week</button><button data-view="day">Today</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="goalsBtn">Goals</button>
    <button class="btn primary" id="addBtn">+ Add task</button>

const STORE = 'cueue-proto-v2';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => S.tasks.find(t => t.id === id);
function fmt(m){ m = Math.round(m); let h = Math.floor(m/60)%24, mm = m%60; const ap = h>=12?'PM':'AM'; h = h%12||12; return h+':'+String(mm).padStart(2,'0')+' '+ap; }
function dayLabel(i){ const d = new Date(WEEK_START); d.setDate(d.getDate()+i); return {name:DAYS[i%7], num:d.getDate(), mon:d.toLocaleString('en-US',{month:'short'})}; }

function estOf(t){ return t.est ?? t.aiEst ?? SPANS[t.span][1]; }
function nextStep(t){ return t.steps.find(s => !s.done); }
function stepsDone(t){ return t.steps.filter(s => s.done).length; }
function frac(t){ return t.done ? 1 : stepsDone(t) / Math.max(1, t.steps.length); }
function isWeek(){ if (S.view==='week') return true; if (S.view==='day') return false; return innerWidth > innerHeight && innerWidth >= 700; }
function locked(){ return S.settings.breakLock && (S.breakDue || S.brk); }
function motionOK(){ return !S.settings.reduce && !matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* goals */
const goalById = id => S.goals.find(g => g.id === id);
function goalPath(id){ const out = []; let g = goalById(id); while (g){ out.unshift(g.title); g = goalById(g.parent); } return out.join(' › '); }
const goalKids = id => S.goals.filter(g => g.parent === id);
const goalTasks = id => S.tasks.filter(t => t.goalId === id);
function goalProgress(id){ const fr = []; (function walk(gid){ goalTasks(gid).forEach(t => fr.push(frac(t))); goalKids(gid).forEach(k => walk(k.id)); })(id);
  return fr.length ? fr.reduce((a,b) => a+b, 0) / fr.length : 0; }
function goalOptions(sel){ const out = ['<option value="">No goal</option>'];
  (function walk(pid, d){ goalKids(pid).forEach(g => { out.push(`<option value="${g.id}" ${g.id===sel?'selected':''}>${'— '.repeat(d)}${esc(g.title)}</option>`); walk(g.id, d+1); }); })(null, 0);
  return out.join(''); }

function level(t, dayIdx){
  if (t.status === 'waiting' || t.done) return 0;
  let l = 0;
  if (t.due != null){ const d = t.due - S.day; l = d < 0 ? 3 : d === 0 ? 2 : d === 1 ? 1 : 0; }
  if (t.cadence && t.missed) l = Math.max(l, Math.min(4, 1 + t.missed));
  if (S.currentId === t.id){ const e = estOf(t); if (t.spent >= 2*e) l = 4; else if (t.spent >= e) l = Math.max(l,3); else if (t.spent >= .8*e) l = Math.max(l,2); }
  if (dayIdx !== S.day) l = Math.min(l, 1);
  return l;
}
function stateOf(t, lvl){ if (t.status === 'waiting') return 'wait'; if (lvl >= 3) return 'late'; if (lvl === 2) return 'due'; return ''; }

/* ---------- scheduling engine ---------- */
function eventsFor(day){
  const out = [];
  S.events.filter(e => e.day === day).forEach(e => {
    out.push({kind:'event', ev:e, start:e.start, end:e.end});
    if (S.settings.prepAll && e.prep && e.who.length) out.push({kind:'prep', ev:e, start:e.start-15, end:e.start});
  });
  return out.sort((a,b) => a.start - b.start);
}
function score(t, at){
  const st = S.settings; let s = t.prio * 10;
  if (t.due != null){ const d = t.due - S.day; s += d < 0 ? 45 : d === 0 ? 30 : d === 1 ? 15 : Math.max(0, 8 - d*2); }
  if (t.cadence && t.missed) s += 12 * t.missed;
  const fresh = at >= st.freshStart && at < st.freshEnd;
  if (t.diff === 3) s += fresh ? 35 : -15;
  if (t.diff === 2 && fresh) s += 8;
  if (t.diff === 1 && t.prio <= 2 && at < 13*60) s -= 20;
  const work = at >= st.workStart && at < st.workEnd;
  if (t.ctx === 'work' && !work) s -= 40;
  if (t.ctx === 'home' && work) s -= 30;
  return s;
}
function schedule(day){
  const st = S.settings, isToday = day === S.day;
  const fixed = eventsFor(day);
  let t = isToday ? Math.max(DAY_START, Math.ceil(S.now/5)*5) : DAY_START;
  const pool = S.tasks.filter(x => x.day === day && !x.done && x.status !== 'waiting')
    .map(x => ({task:x, rem:Math.max(5, estOf(x) - (x.spent||0))}));
  const blocks = []; let sinceBreak = isToday ? S.workSince : 0, breakN = 0;
  const curIdx = pool.findIndex(p => p.task.id === S.currentId);
  if (isToday && S.brk){ const left = Math.max(1, S.brk.min - S.brk.spent); t += left; }
  if (isToday && curIdx > -1){
    const p = pool.splice(curIdx,1)[0];
    blocks.push({kind:'task', task:p.task, start:t, dur:p.rem, current:true});
    t += p.rem + st.buffer; sinceBreak += p.rem;
  }
  let guard = 0;
  while (pool.length && t < DAY_END && guard++ < 300){
    const inEv = fixed.find(f => f.start <= t && f.end > t);
    if (inEv){ t = inEv.end; continue; }
    const nextEv = fixed.find(f => f.start > t);
    const gapEnd = nextEv ? nextEv.start : DAY_END, gap = gapEnd - t;
    if (gap < 10){ t = nextEv ? nextEv.end : DAY_END; continue; }
    if (sinceBreak >= st.breakEvery && gap >= 20){
      const b = BREAKS[[0,4,3,2][breakN++ % 4]];
      blocks.push({kind:'break', start:t, dur:b.min, b}); t += b.min; sinceBreak = 0; continue;
    }
    const inWork = t >= st.workStart && t < st.workEnd;
    const cands = pool.filter(p => (p.rem <= gap || (p.task.split && gap >= 25))
        && (p.task.ctx !== 'work' || inWork || (t >= st.workEnd && p.task.due != null && p.task.due <= day)))
      .sort((a,b) => score(b.task,t) - score(a.task,t));
    if (!cands.length){ t = Math.min(...[st.workStart, st.workEnd].filter(b => b > t).concat([nextEv ? nextEv.end : DAY_END])); continue; }
    const p = cands[0];
    const dur = Math.min(p.rem, gap, p.task.split ? 60 : Infinity);
    const chunk = dur < p.rem || p.chunks;
    blocks.push({kind:'task', task:p.task, start:t, dur, chunk: chunk ? (p.chunks = (p.chunks||0)+1) : 0});
    p.rem -= dur; if (p.rem <= 0) pool.splice(pool.indexOf(p),1);
    t += dur + st.buffer; sinceBreak += dur;
  }
  const items = blocks.concat(fixed).sort((a,b) => a.start - b.start);
  return {items, overflow: pool.map(p => p.task)};
}
function firstUp(){ const it = schedule(S.day).items.find(i => i.kind === 'task' && !i.current); return it ? it.task : null; }

/* ---------- rendering ---------- */
function pieHTML(t, big){

}
function dueChip(t){
  if (t.due == null || t.done) return '';
  const d = t.due - S.day;
  if (d < 0) return `<span class="chip hot">Overdue</span>`;
  if (d === 0) return `<span class="chip warn">Due today</span>`;
  if (d === 1) return `<span class="chip">Due tomorrow</span>`;
  return `<span class="chip">Due ${DAYS[t.due] || 'later'}</span>`;
}
function stepLI(t, s, i, extra){
  return `<li class="${s.done?'done':''} ${extra||''}"><input type="checkbox" id="st-${t.id}-${i}-${extra?'n':'d'}" data-task="${t.id}" data-step="${i}" ${s.done?'checked':''}>

}
function cardHTML(t, start, dayIdx, chunk){
  const ns = nextStep(t), lvl = level(t, dayIdx), st = stateOf(t, lvl);
  const diff = [1,2,3].map(i => `<i class="${i<=t.diff?'on':''}"></i>`).join('');
  const src = t.source === 'email' ? `<span title="From email">${ICON.mail}</span>` : t.source === 'template' ? `<span title="From template">${ICON.tmpl}</span>` : '';
  const timeTxt = S.settings.times && start != null ? `<span class="time">~${fmt(start)}</span>` : '';

/* ---------- live updates ---------- */

        if (t.spent >= 2*e && !t.warned2){ t.warned2 = true; cue(4); toast('Re-planned the rest of today', 'This task hit twice its estimate, so later tasks moved.'); render(); }

let actx;

      const t0 = actx.currentTime + i*gap; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.02); g.gain.exponentialRampToValueAtTime(.001, t0+.35);

function cue(lvl){

const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], animating = false;
function confetti(x, y, n, spread){
  if (!motionOK()) return;

  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = (2 + Math.random()*spread);
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - spread*.6, r:3+Math.random()*4, c:cols[i%cols.length], life:60+Math.random()*40, rot:Math.random()*6}); }
  if (!animating){ animating = true; requestAnimationFrame(drawConfetti); }
}
function drawConfetti(){

    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha = Math.max(0, Math.min(1, p.life/30)); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r/2, p.r*2, p.r); cx.restore(); });

const TEMPLATES = {

function aiSteps(title){
  const s = title.toLowerCase();
  if (/follow|check in|remind|chase/.test(s)) return TEMPLATES.followup.steps;
  if (/agreement|contract/.test(s)) return TEMPLATES.agreement.steps;
  if (/onboard|nurse|hire/.test(s)) return TEMPLATES.onboard.steps;
  if (/bill|missing time|invoice/.test(s)) return TEMPLATES.billing.steps;
  return [['Decide the first 5-minute action'],['Gather what you need'],['Do the main work'],['Check it against "done when"']];
}
function aiDone(title){
  const s = title.toLowerCase();
  if (/follow|check in|chase/.test(s)) return 'They confirmed it\'s done and sent proof';
  if (/agreement|contract/.test(s)) return 'Agreement sent and signed';
  if (/call|email|text/.test(s)) return 'Message sent and reply logged';
  return 'The result exists and you can show it to someone';
}

  if (el.dataset.brk){ startBreak(el.dataset.brk); return; }
  if (el.dataset.donelist){ openDoneList(+el.dataset.donelist); return; }
  if (el.dataset.focus){ S.focus = el.dataset.focus; render(); toast(S.focus==='all'?'Showing everything':'Focus: ' + (S.focus==='work'?'Work':'Home'), S.focus==='work'?'Home items fade back in during your last 3 work hours.':''); return; }
  if (el.dataset.view){ S.view = el.dataset.view; S.viewDay = S.day; render.scrolled = false; render(); return; }
  if (el.dataset.speed){ S.speed = +el.dataset.speed; render(); return; }
  if (el.dataset.nav){ S.viewDay = Math.max(0, Math.min(6, S.viewDay + +el.dataset.nav)); render(); return; }
  if (el.classList.contains('card') && el.dataset.id){ openTask(byId(el.dataset.id)); return; }
  const a = el.dataset.act, cur = byId(S.currentId);
  switch (a){
    case 'startday': closeSheet(); startNext(); break;
    case 'start': closeSheet(); S.dayMode = true; startTask(sheetTask); break;
    case 'stop': S.currentId = null; S.paused = false; closeSheet(); render(); toast('Stopped', 'Time so far is saved. Re-planned today.'); break;
    case 'pause': S.paused = true; render(); toast('Paused', 'The timer is stopped. Resume when you\'re ready.'); break;
    case 'resume': S.paused = false; render(); break;
    case 'more15': if (cur){ cur.est = estOf(cur) + 15; cur.warned1 = false; cur.warned2 = false; render(); } break;
    case 'finish': if (cur) openComplete(cur); break;
    case 'complete': openComplete(sheetTask); break;
    case 'reopen': sheetTask.done = false; sheetTask.day = S.day; const li = S.log.map(l => l.taskId === sheetTask.id && l.kind === 'task').lastIndexOf(true); if (li > -1) S.log.splice(li,1); openTask(sheetTask); render(); toast('Task reopened', 'It\'s back on today\'s board.'); break;
    case 'confirmdone': {
      const note = $('#resNote').value.trim(), files = [...$('#proofFile').files].map(f => f.name);
      if (sheetTask.proof && note.length < 3){ $('#resErr').hidden = false; $('#resNote').focus(); return; }
      completeTask(sheetTask, note, files); break; }
    case 'brkpick': openBreakPicker(); break;
    case 'endbrk': endBreak(); break;
    case 'brkmore': if (S.brk){ S.brk.min += 5; S.brk.ready = false; render(); } break;
    case 'snooze': S.breakDue = null; S.workSince = Math.max(0, S.settings.breakEvery - 15); render(); break;
    case 'wait': {
      const box = document.createElement('div'); box.className = 'actions';
      box.innerHTML = `<input id="waitWho" class="inp" placeholder="Who or what are you waiting on?" style="flex:1;min-width:0;width:auto"><button class="btn small primary" data-act="savewait">Save</button>`;
      el.closest('.actions').after(box); $('#waitWho').focus(); break; }
    case 'savewait': { const w = $('#waitWho').value.trim() || 'a reply';
      sheetTask.status = 'waiting'; sheetTask.waitingOn = w; if (S.currentId === sheetTask.id) S.currentId = null;
      closeSheet(); render(); toast('Waiting on ' + w, 'Moved out of today\'s plan. Cueue will nudge you to follow up tomorrow.'); break; }
    case 'unblock': sheetTask.status = null; sheetTask.day = S.day; closeSheet(); render(); toast('Unblocked', 'Back in today\'s plan.'); break;
    case 'addstep': { const v = $('#newStep').value.trim(); if (v){ sheetTask.steps.push({t:v}); openTask(sheetTask); render(); } break; }
    case 'aisteps': { const have = new Set(sheetTask.steps.map(s => s.t)); aiSteps(sheetTask.title).forEach(([t,type]) => { if (!have.has(t)) sheetTask.steps.push({t, type}); }); openTask(sheetTask); render(); toast('Suggested steps added', 'Edit or remove any that don\'t fit.'); break; }
    case 'saveadd': saveAdd(); break;
    case 'goals': openGoals(); break;
    case 'savegoal': case 'savesub': {
      const inp = a === 'savegoal' ? $('#newGoal') : $('#newSub'); const v = inp.value.trim(); if (!v){ inp.focus(); return; }
      S.goals.push({id:'g' + (S.nextId++), title:v, parent: a === 'savesub' ? inp.dataset.parent : null});
      openGoals(); save(); toast(a === 'savegoal' ? 'Goal added' : 'Sub-goal added', 'Add tasks to it with "+ Task".'); break; }
    case 'addsub': {
      document.querySelectorAll('.subrow').forEach(n => n.remove());
      const row = document.createElement('div'); row.className = 'actions subrow';
      row.innerHTML = `<input id="newSub" class="inp" data-parent="${el.dataset.goal}" placeholder="Sub-goal of ${esc(goalById(el.dataset.goal).title)}" style="flex:1;min-width:0;width:auto"><button class="btn small primary" data-act="savesub">Add</button>`;
      $('#ga-' + el.dataset.goal).after(row); $('#newSub').focus(); break; }
    case 'addgtask': openAdd(el.dataset.goal); break;
    case 'pushlater': {
      const {overflow} = schedule(S.day); let n = 0;
      overflow.filter(t => t.due == null || t.due > S.day).sort((a,b) => (b.due ?? 99) - (a.due ?? 99)).forEach(t => { if (S.day < 6){ t.day = S.day + 1; n++; } });
      render(); toast(n ? 'Moved ' + n + ' task' + (n>1?'s':'') + ' to tomorrow' : 'Nothing could move', n ? 'Tasks due soonest stayed on today.' : 'Everything left is due today.'); break; }
    case 'breakdown': toast('Tip', 'Add a smaller first step below, something you can do in 5 minutes.'); $('#newStep') && $('#newStep').focus(); break;
    case 'delegate': toast('Hand-offs come with team workspaces', 'Phase 6 in the roadmap.'); break;
    case 'resched': sheetTask.day = Math.min(6, S.day + 2); sheetTask.rolled = 0; closeSheet(); render(); toast('Moved to ' + DAYS[sheetTask.day], 'Rollover count reset.'); break;
    case 'drop': S.tasks = S.tasks.filter(t => t !== sheetTask); if (S.currentId === sheetTask.id) S.currentId = null; closeSheet(); render(); toast('Dropped', 'Letting go is a valid choice.'); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || el.dataset.step === undefined) return;
  const t = byId(el.dataset.task), i = +el.dataset.step;
  if (el.checked) checkStep(t, i, el); else uncheckStep(t, i);
  const root = $('#sheetRoot');
  if (root.dataset.kind === 'task' && root.dataset.task === t.id && (nextStep(t) || !el.checked || locked())) openTask(t);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'newGoal') $('[data-act="savegoal"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newSub') $('[data-act="savesub"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newStep') $('[data-act="addstep"]').click();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('card') && ev.target.dataset.id){ ev.preventDefault(); openTask(byId(ev.target.dataset.id)); }
});
$('#addBtn').onclick = () => openAdd(null);
$('#goalsBtn').onclick = openGoals;
$('#settingsBtn').onclick = openSettings;
$('#playBtn').onclick = () => { S.running = !S.running; render(); };
$('#endDayBtn').onclick = endDay;
$('#resetBtn').onclick = () => { S = seed(); render.scrolled = false; closeSheet(); render(); toast('Demo reset'); };
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(render, 150); });

render();
requestAnimationFrame(tick);
setInterval(save, 5000);
})();
</script>
