<title>Cueue Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header + board (7 day columns in landscape, one day in portrait) + demo clock bar.
   Card color = what the card needs from you: Now (indigo), Due today (amber), Late (red), Break (green), Waiting (grey).
   Edge light: a glow runs along each visible card's top edge; color, speed and thickness rise with urgency. */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#172033; --muted:#5D667A; --line:#D8DDE7;
  --accent:#3B55F0; --accent-soft:#E3E8FE; --accent-ink:#FFFFFF;
  --work:#0F8B8D; --home:#D9702A; --ok:#169A63; --warn:#D99A0B; --hot:#E0434A; --rest:#1E9E6A; --violet:#8A4FD8;
  --event-bg:#E2E6EE; --event-ink:#4A5366; --pie-track:#E6E9F0; --scrim:rgba(15,20,32,.45);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --amp:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F; --violet:#B38BFF;
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F; --violet:#B38BFF;
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.rest{background:var(--rest);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-bottom:1px solid var(--line);font-size:14px}

/* Board */
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{flex:1 0 230px;min-width:0;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;min-height:0}
.col.today{flex-basis:320px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.board.single .col{flex:1 1 auto;max-width:640px;margin-inline:auto}
.col.past{opacity:.75}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.colhead .date{color:var(--muted);font-size:13px;font-weight:500}
.colhead .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.colhead .nav{display:flex;gap:4px}
.colbody{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.colbody > *{flex-shrink:0}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dayprog{margin-top:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dayprog .row{display:flex;justify-content:space-between;color:var(--muted)}
.dayprog .row b{color:var(--ink)}

.bar{height:8px;border-radius:999px;background:var(--pie-track);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s ease}
.bar.thin{height:4px}

/* Big panels */
.panel{position:relative;overflow:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.panel.restp{border-color:var(--rest);background:color-mix(in srgb,var(--rest) 10%,var(--surface))}
.panel.latep{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 7%,var(--surface))}
.panel .ph{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.panel .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--accent)}
.panel.restp .tag{color:var(--rest)} .panel.latep .tag{color:var(--hot)}
.panel h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.panel .main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.panel .words{font-weight:600}
.panel .sub{font-size:13px;color:var(--muted);line-height:1.4}
.panel .row{display:flex;gap:6px;flex-wrap:wrap}
.panel .steps li.nextup{background:var(--surface);border-radius:8px;font-weight:600}
.checkin{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.brkopt{border:1px solid color-mix(in srgb,var(--rest) 40%,var(--line));background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.brkopt b{font-size:14px} .brkopt span{font-size:12px;color:var(--muted)}
.brkopt.star{border-color:var(--rest);box-shadow:0 0 0 2px color-mix(in srgb,var(--rest) 30%,transparent)}

/* Cards */
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 0 12px;cursor:pointer;
  transition:opacity .6s ease, box-shadow .3s ease;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card.s-due{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.card.s-late{background:color-mix(in srgb,var(--hot) 10%,var(--surface))}
.card.s-wait{background:var(--surface-2);border-style:dashed}
.card .top{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card .time{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.ctx{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.ctx::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ctx.work{color:var(--work)} .ctx.home{color:var(--home)}
.diff{margin-left:auto;display:inline-flex;gap:2px}
.diff i{width:5px;height:10px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--ink)}
.card .title{grid-column:1/2;font-weight:700;line-height:1.25;font-size:15px;min-width:0;overflow-wrap:anywhere}
.card .next{grid-column:1/2;font-size:13.5px;color:var(--muted);line-height:1.3;min-width:0;overflow-wrap:anywhere;margin-top:2px}
.card .next b{color:var(--ink);font-weight:600}
.nextck{display:flex;gap:8px;align-items:flex-start;cursor:pointer;color:var(--ink);font-weight:600}
.nextck input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ok)}
.card .ready{color:var(--ok);font-weight:700}
.verify{grid-column:2;grid-row:2/4;align-self:center;border:0;background:var(--ok);color:#fff;font-weight:700;font-size:13px;padding:7px 11px;border-radius:999px}
.card .meta{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.card .meta svg{width:14px;height:14px}
.card .prog{grid-column:1/-1;margin:8px -10px 0 -12px;height:4px;background:var(--pie-track)}
.card .prog i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.hot{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.okc{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.card.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.2}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}

/* Pie timer */
.pie{--p:0;--fill:var(--hot);width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--fill) calc(var(--p)*1turn),var(--pie-track) 0);flex:none}
.pie.big{width:96px;height:96px}
.pie.rest{--fill:var(--rest)}
.pie.over{box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 45%,transparent)}
.pie.off{display:none}

/* Event + prep + planned break */
.event{background:var(--event-bg);color:var(--event-ink);border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:pointer}
.event .time{font-family:var(--font-mono);font-size:11px}
.event b{display:block;color:var(--ink);font-weight:600}
.event.pastev{opacity:.55}
.prep{background:transparent;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink)}
.prep .tag{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.brkcard{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;cursor:pointer;
  background:color-mix(in srgb,var(--rest) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--rest) 55%,var(--line));text-align:left}
.brkcard svg{width:20px;height:20px;color:var(--rest);flex:none}
.brkcard b{display:block;font-size:14px}
.brkcard span{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px}

/* Cue levels: outer glow + periodic shake */
.card.lvl-1{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent)}
.card.lvl-2{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 65%,transparent)}
.card.lvl-3{box-shadow:0 0 0 2px color-mix(in srgb,var(--hot) 65%,transparent)}
.card.lvl-4{box-shadow:0 0 0 3px var(--hot)}
.motion .card.lvl-2{animation:shake 5s ease-in-out infinite}
.motion .card.lvl-3{animation:shake 3s ease-in-out infinite;--k:1.6}
.motion .card.lvl-4{animation:shake 1.8s ease-in-out infinite;--k:2.4}
@keyframes shake{
  0%,14%,100%{transform:translateX(0) rotate(0)}
  2%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.6deg)}
  4%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.6deg)}
  6%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.4deg)}
  8%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.4deg)}
  10%{transform:translateX(calc(var(--amp)*var(--k,1)*-.5))}
}
/* Edge light: travels the top edge left to right, brightest at the card's center, fades out at the right */
.card,.panel{--ec:var(--accent);--es:9s;--eh:2px;--eg:5px}
.card.lvl-1{--ec:var(--warn);--es:7s;--eh:3px;--eg:6px}
.card.lvl-2{--ec:#F59E0B;--es:4.5s;--eh:3px;--eg:9px}
.card.lvl-3{--ec:var(--hot);--es:2.8s;--eh:4px;--eg:11px}
.card.lvl-4{--ec:var(--hot);--es:1.6s;--eh:5px;--eg:15px}
.panel{--ec:var(--accent);--es:5s;--eh:3px;--eg:9px}
.panel.restp{--ec:var(--rest);--es:3.5s}
.panel.latep{--ec:var(--hot);--es:2s;--eh:4px;--eg:12px}
.card::after,.panel::after{content:"";position:absolute;top:0;left:0;width:46%;height:var(--eh);pointer-events:none;opacity:0;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,transparent 0%,var(--ec) 30%,color-mix(in srgb,var(--ec) 55%,#fff) 50%,var(--ec) 70%,transparent 100%);
  box-shadow:0 0 var(--eg) calc(var(--eh) / 2) color-mix(in srgb,var(--ec) 70%,transparent);transform:translateX(-100%)}
.edge-on .inview::after{animation:edge var(--es) linear var(--ed,0s) infinite}
@keyframes edge{
  0%{transform:translateX(-100%);opacity:0}
  6%{opacity:.25}
  24%{transform:translateX(59%);opacity:1}
  42%{transform:translateX(217%);opacity:0}
  100%{transform:translateX(217%);opacity:0}
}

/* Demo clock bar */
.simbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line);font-size:13px}
.simbar .clock{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;font-weight:500}
.simbar .tagline{color:var(--muted)}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
.sheet.wide{max-width:980px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;background:none;border:0;padding:0;text-align:left}
button.crumb:hover{color:var(--accent);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.steps li.done .t{color:var(--muted);text-decoration:line-through}
.steps input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.steps label{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
.stype{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.when{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
details.donesteps{margin-top:8px}
details.donesteps summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;padding:4px 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;width:100%}
.estrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.quote{background:var(--surface-2);border-left:3px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--muted)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13.5px}
.sw{width:28px;height:18px;border-radius:6px;border:1px solid var(--line)}
a{color:var(--accent)}

/* Avatars for people and roles */
.av{--c:var(--accent);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.av i{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.25);flex:none}

/* Goals */
.ring{--p:0;--rc:var(--ok);position:relative;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78% 100%),conic-gradient(var(--rc) calc(var(--p)*1turn),var(--pie-track) 0)}
.ring.sm{width:26px;height:26px;font-size:0}
.gcard{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface);margin-bottom:14px}
.ghead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.gtitle{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0}
.gmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.why{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink)}
.tline{margin-top:12px}
.tline .bar{height:10px;overflow:visible}
.tline .bar i{border-radius:999px}
.tline .elapsed{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.tline .legendrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.gchildren{margin:12px 0 0 12px;padding-left:16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.gsub{position:relative}
.gsub::before{content:"";position:absolute;left:-18px;top:16px;width:14px;height:2px;background:var(--line)}
.grow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.grow b{font-size:15px}

.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:14px}
.trow .tic{width:18px;height:18px;color:var(--muted)}

.trow .tt{min-width:0;overflow-wrap:anywhere}
.trow .tt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.trow.isdone{opacity:.6}
.gacts{display:flex;gap:6px;flex-wrap:wrap}

/* Template library */
.tpl{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tpl h3{margin:0;font-family:var(--font-display);font-size:18px}
.tpl .lanes{display:flex;gap:8px;flex-wrap:wrap}
.scope{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}

/* Workflow diagram (swimlanes) */
.flowwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);margin-top:10px}
.flow{position:relative;display:grid;gap:0;min-width:max-content;padding:10px 14px 10px 0}
.lane{display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:13px;font-weight:700;position:sticky;left:0;z-index:2;background:var(--surface-2);border-right:1px solid var(--line)}
.laneband{border-bottom:1px dashed var(--line);z-index:0}
.fcell{position:relative;z-index:2;margin:10px 18px;display:flex;flex-direction:column;gap:8px;align-self:center}
.fnode{position:relative;z-index:2;margin:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:4px;align-self:center}
.fnode b{font-size:14px;line-height:1.2}
.fnode .fm{color:var(--muted);font-size:12px}
.fnode.st-done{border-color:var(--ok)}
.fnode.st-active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fnode.st-waiting{border-style:dashed}
.fnode.st-others{border-color:color-mix(in srgb,var(--violet) 55%,var(--line))}
.flowsvg{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
.flowsvg path.link{fill:none;stroke:var(--muted);stroke-width:1.6}
.flowsvg path.handoff{fill:none;stroke:var(--violet);stroke-width:2;stroke-dasharray:5 4}
.flowsvg .ah{fill:var(--muted)} .flowsvg .ahv{fill:var(--violet)}
.flowkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.flowkey span{display:inline-flex;align-items:center;gap:6px}
.flowkey i{display:inline-block;width:22px;height:0;border-top:2px solid var(--muted)}
.flowkey i.h{border-top:2px dashed var(--violet)}

/* Get ahead */
.chip.ahead{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,var(--line))}
.panel.aheadp{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--surface));--ec:var(--violet)}
.panel.aheadp .tag{color:var(--violet)}
/* Flow builder */
.fnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fnode.editable{cursor:pointer}
.ntools{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.ntools button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;min-width:26px;height:24px;font-size:12px;line-height:1;padding:0 4px;color:var(--muted)}
.ntools button:hover{color:var(--ink);border-color:var(--accent)}
.fnode.ghost{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;min-height:56px;cursor:pointer;font-weight:600}
.fnode.ghost:hover{border-color:var(--accent);color:var(--accent)}
.fnode .ft{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.depgrid{display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface-2);cursor:pointer}
.dep small{color:var(--muted)}

.stageed{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--surface)}
.handoff-note{font-size:13.5px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--violet) 10%,var(--surface));margin:6px 0 10px}
.btask{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:6px;font-size:14px}
.btask small{color:var(--muted)}
.lockmsg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:8px 0}
.lockmsg svg{width:16px;height:16px;flex:none}
/* Org chart */
.org{list-style:none;margin:0;padding:0}
.org .org{margin-left:18px;padding-left:16px;border-left:2px solid var(--line)}
.org li{margin:8px 0;position:relative}
.org .org > li::before{content:"";position:absolute;left:-16px;top:24px;width:14px;height:2px;background:var(--line)}
.op{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);flex-wrap:wrap;max-width:100%}
.op.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.op b{font-size:14px} .op small{color:var(--muted);font-size:12px;display:block}
.tablewrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.ptable th,.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{font-size:12px;color:var(--muted);font-weight:700}
.ptable th.cur{color:var(--accent)}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}

/* Toasts + confetti */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:down .25s ease;transition:opacity .3s}
@keyframes down{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.sheet.still{animation:none}
.toast small{display:block;font-weight:500;opacity:.8}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){.card,.sheet,.toast{animation:none!important}}

/* templates -> goals */
function instantiate(tp, subject){
  ensureStageIds(tp);
  const root = {id:newId('g'), title: tp.name + (subject ? ': ' + subject : ''), parent:null, horizon:{...tp.horizon}, start:S.day, fromTemplate:tp.id, why:tp.desc};
  S.goals.push(root);
  const gmap = {}; let created = 0;
  tp.stages.forEach(st => { const g = {id:newId('g'), title:st.title, parent:root.id, role:resolveRole(st.role, subject), start:S.day, horizon: st.horizon ? {...st.horizon} : null}; gmap[st.id] = g; S.goals.push(g); });
  tp.stages.forEach(st => {
    const g = gmap[st.id]; g.after = (st.after || []).map(a => gmap[a] && gmap[a].id).filter(Boolean);
    st.tasks.forEach(tt => {
      const t = {id:newId('n'), title:tt.title, ctx: tp.ctx || 'work', diff: tt.est >= 60 ? 2 : 1, span: spanFor(tt.est), est: tt.est, prio:2,
        owner: g.role, goalId: g.id, steps: (tt.steps && tt.steps.length ? tt.steps : [tt.title]).map(s => ({t:s})), doneWhen: tt.doneWhen || aiDone(tt.title), proof: tp.scope === 'company', source:'template',
        cadence: tt.cadence ? {every:tt.cadence, label: tt.cadLabel || 'Every ' + tt.cadence + ' days'} : null, day: null, status: null, notes:''};
      if (g.after.length){ t.status = 'waiting'; t.waitStages = [...g.after]; t.waitingOn = waitText(g.after); }
      else if (g.role === 'me') t.day = S.day;
      S.tasks.push(t); created++;
    });
  });
  return {root, created};
}
function resolveRole(role, subject){
  if (role !== 'crmowner' || !S.crmConnected || !subject) return role;
  const q = subject.toLowerCase(), rec = S.crm.find(r => r.name.toLowerCase().includes(q) || q.includes(r.name.toLowerCase()));
  if (!rec) return role;
  return rec.ownerId === 'p-you' ? 'me' : 'crm:' + rec.owner;
}
function taskToTpl(t){ return {title:t.title, est:estOf(t), steps:t.steps.map(s => s.t), cadence: t.cadence ? t.cadence.every : null, cadLabel: t.cadence ? t.cadence.label : null}; }
function templateFromGoal(g){
  const stages = [], kids = goalKids(g.id);
  if (goalTasks(g.id).length) stages.push({id:g.id, after:[], title:g.title, role:goalTasks(g.id)[0].owner || 'me', tasks:goalTasks(g.id).map(taskToTpl)});
  kids.forEach((k, i) => {
    const ts = []; (function walk(id){ goalTasks(id).forEach(t => ts.push(t)); goalKids(id).forEach(x => walk(x.id)); })(k.id);
    stages.push({id:k.id, after: k.after ? [...k.after] : (i ? [kids[i-1].id] : (stages.length ? [g.id] : [])), title:k.title, role: k.role || (ts[0] && ts[0].owner) || 'me', horizon:k.horizon, tasks: ts.map(taskToTpl)});
  });
  const tp = {id:newId('tp'), scope:'mine', owner:'me', name:g.title, desc:g.why || 'Saved from your goals.', horizon: g.horizon || {n:1,unit:'weeks'}, ctx: (S.tasks.find(t => t.goalId === g.id) || {}).ctx || 'work', stages};
  S.templates.push(tp); return tp;
}
const ROUTINE_SETS = [
  {re:/weight|lose|pound|lbs|fit|diet|health/i, tp:'tp3'},
  {re:/run|5k|marathon|walk/i, stages:[{title:'Build the habit', tasks:[{title:'Run/walk intervals', est:30, cadence:2, cadLabel:'3× a week', steps:['Warm up','Intervals','Cool down']}]},{title:'Track it', tasks:[{title:'Log your runs', est:5, cadence:7, cadLabel:'Weekly', steps:['Log distance and time']}]}]},
  {re:/learn|study|read|course|certif/i, stages:[{title:'Practice', tasks:[{title:'Study session', est:25, cadence:1, cadLabel:'Daily', steps:['Open the material','25 focused minutes','Write 3 takeaways']}]},{title:'Review', tasks:[{title:'Weekly review quiz', est:30, cadence:7, cadLabel:'Weekly', steps:['Quiz yourself','Note weak spots']}]}]}

function suggestRoutines(g){
  const set = ROUTINE_SETS.find(r => r.re.test(g.title));
  const stages = set ? (set.tp ? S.templates.find(t => t.id === set.tp).stages : set.stages)
    : [{title:'Daily progress', tasks:[{title:'15 minutes toward ' + g.title, est:15, cadence:1, cadLabel:'Daily', steps:['Pick one small action','Do it for 15 minutes']}]},
       {title:'Weekly check-in', tasks:[{title:'Review progress', est:20, cadence:7, cadLabel:'Weekly', steps:['What worked?','What gets in the way?','Adjust next week']}]}];
  const ctx = /weight|lose|run|walk|fit|health|5k|read|pound/i.test(g.title) ? 'home' : 'work';
  stages.forEach(st => {
    const sg = {id:newId('g'), title:st.title, parent:g.id, start:S.day, horizon: g.horizon ? {...g.horizon} : null}; S.goals.push(sg);

function stageStatus(g){
  const ts = []; (function walk(id){ goalTasks(id).forEach(t => ts.push(t)); goalKids(id).forEach(k => walk(k.id)); })(g.id);
  if (!ts.length) return '';
  if (ts.every(t => t.done)) return 'done';

      closeSheet(); render(); toast('Waiting on ' + w, 'Moved out of today\'s plan. Cueue will nudge you to follow up tomorrow.'); break; }
    case 'unblock': sheetTask.status = null; sheetTask.day = S.day; closeSheet(); render(); toast('Unblocked', 'Back in today\'s plan.'); break;
    case 'addstep': { const v = $('#newStep').value.trim(); if (v){ sheetTask.steps.push({t:v}); openTask(sheetTask); render(); } break; }
    case 'aisteps': { const have = new Set(sheetTask.steps.map(s => s.t)); aiSteps(sheetTask.title).forEach(([t,type]) => { if (!have.has(t)) sheetTask.steps.push({t, type}); }); openTask(sheetTask); render(); toast('Suggested steps added', 'Edit or remove any that don\'t fit.'); break; }
    case 'saveadd': saveAdd(); break;
    case 'goals': openGoals(); break;
    case 'library': openLibrary(); break;
    case 'savegoal': case 'savesub': {
      const isGoal = a === 'savegoal', inp = isGoal ? $('#newGoal') : $('#newSub'), v = inp.value.trim(); if (!v){ inp.focus(); return; }
      const pre = isGoal ? 'ng' : 'ns', n = Math.max(1, +$('#'+pre+'N').value || 1), unit = $('#'+pre+'U').value;
      S.goals.push({id:newId('g'), title:v, parent: isGoal ? null : inp.dataset.parent, horizon:{n, unit}, start:S.day});
      openGoals(); save(); toast(isGoal ? 'Goal added: ' + n + ' ' + unit : 'Sub-goal added', isGoal ? 'Try "Suggest routines" to break it into daily steps.' : 'Add tasks to it with "+ Task".'); break; }
    case 'addsub': {
      document.querySelectorAll('.subrow').forEach(n => n.remove());
      const row = document.createElement('div'); row.className = 'actions subrow'; row.style.marginTop = '6px';
      row.innerHTML = `<input id="newSub" class="inp" data-parent="${gid}" placeholder="Sub-goal of ${esc(goalById(gid).title)}" style="flex:1;min-width:160px;width:auto">${horizonInputs('ns')}<button class="btn small primary" data-act="savesub">Add</button>`;
      $('#ga-' + gid).after(row); $('#newSub').focus(); break; }
    case 'addgtask': openAdd(gid); break;
    case 'suggest': { const g = goalById(gid), n = suggestRoutines(g); render(); openGoals(); toast('Added ' + n + ' routine sub-goals to ' + g.title, 'Each one has a small daily or weekly task on your board.'); break; }
    case 'savetpl': { const tp = templateFromGoal(goalById(gid)); save(); toast('Saved as a template: ' + tp.name, 'Find it under My templates in the Library.'); break; }
    case 'goalflow': { const g = goalById(gid); openFlow(g.title, 'Each stage is a sub-goal, placed in the lane of whoever owns it. Dashed arrows are hand-offs.', goalStages(g), `<button class="btn" data-act="goals">Back to goals</button>`); break; }
    case 'tplflow': openFlow(tpl.name, scopeLabel(tpl) + ' · ' + horizonLabel(tpl) + '. ' + (tpl.desc||''), tpl.stages.map(s => ({...s})), `<button class="btn" data-act="library">Back to library</button><button class="btn" data-act="editflow" data-tpl="${tpl.id}">Open in builder</button><button class="btn primary" data-act="tpluse" data-tpl="${tpl.id}">Use this process</button>`); break;
    case 'tpluse': {
      if ($('#tplFor')){ const {root, created} = instantiate(tpl, $('#tplFor').value.trim()); closeSheet(); render(); openGoals(); toast('Created: ' + root.title, created + ' tasks across ' + tpl.stages.length + ' stages. Yours are on your board.'); break; }
      const host = $('#tu-' + tpl.id) || el.closest('.actions');
      const row = document.createElement('div'); row.className = 'actions'; row.style.marginTop = '6px';
      row.innerHTML = `<input id="tplFor" class="inp" placeholder="${tpl.scope==='company'?'Who is it for? e.g. Jordan Lee':'Optional name, e.g. by spring'}" style="flex:1;min-width:150px;width:auto"><button class="btn small primary" data-act="tpluse" data-tpl="${tpl.id}">Create goal</button>`;
      host.after(row); $('#tplFor').focus(); break; }
    case 'pushlater': {
      const {overflow} = schedule(S.day); let n = 0;
      overflow.filter(t => t.due == null || t.due > S.day).sort((a,b) => (b.due ?? 99) - (a.due ?? 99)).forEach(t => { if (S.day < 6){ t.day = S.day + 1; n++; } });
      render(); toast(n ? 'Moved ' + n + ' task' + (n>1?'s':'') + ' to tomorrow' : 'Nothing could move', n ? 'Tasks due soonest stayed on today.' : 'Everything left is due today.'); break; }
    case 'breakdown': toast('Tip', 'Add a smaller first step below, something you can do in 5 minutes.'); $('#newStep') && $('#newStep').focus(); break;
    case 'delegate': toast('Hand-offs come with team workspaces', 'Phase 6 in the roadmap. Company processes in the Library preview how it works.'); break;
    case 'resched': sheetTask.day = Math.min(6, S.day + 2); sheetTask.rolled = 0; closeSheet(); render(); toast('Moved to ' + DAYS[sheetTask.day], 'Rollover count reset.'); break;
    case 'drop': S.tasks = S.tasks.filter(t => t !== sheetTask); if (S.currentId === sheetTask.id) S.currentId = null; closeSheet(); render(); toast('Dropped', 'Letting go is a valid choice.'); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || el.dataset.step === undefined) return;
  const t = byId(el.dataset.task), i = +el.dataset.step;
  if (el.checked) checkStep(t, i, el); else uncheckStep(t, i);
  const root = $('#sheetRoot');
  if (root.dataset.kind === 'task' && root.dataset.task === t.id) openTask(t);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'newGoal') $('[data-act="savegoal"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newSub') $('[data-act="savesub"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newStep') $('[data-act="addstep"]').click();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('card') && ev.target.dataset.id){ ev.preventDefault(); openTask(byId(ev.target.dataset.id)); }
});
$('#addBtn').onclick = () => openAdd(null);
$('#goalsBtn').onclick = openGoals;
$('#libBtn').onclick = openLibrary;
$('#orgBtn').onclick = openOrg;
$('#clearBtn').onclick = () => { // demo shortcut: finish everything planned today so "Get ahead" appears
  S.tasks.filter(t => t.day === S.day && isMine(t) && !t.done && t.status !== 'waiting').forEach(t => {
    S.log.push({title:t.title, day:S.day, taskId:t.id, kind:'task'}); t.completions = (t.completions||0) + 1;
    if (t.cadence){ t.day += t.cadence.every; t.steps.forEach(s => { s.done = false; delete s.at; }); t.missed = 0; if (t.due != null) t.due = t.day; }
    else { t.done = true; t.doneDay = S.day; t.steps.forEach(s => { s.done = true; }); }
    t.spent = 0; t.status = null;
  });
  Object.assign(S, {currentId:null, paused:false, brk:null, breakDue:null, workSince:0});
  closeSheet(); render(); toast('Today cleared (demo)', 'Now try "Get ahead" at the top of Today.');
};
$('#settingsBtn').onclick = openSettings;
$('#playBtn').onclick = () => { S.running = !S.running; render(); };
$('#endDayBtn').onclick = endDay;
$('#resetBtn').onclick = () => { S = seed(); render.scrolled = false; closeSheet(); render(); toast('Demo reset'); };
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { render(); if ($('#sheetRoot').dataset.kind === 'flow') drawFlow(); }, 150); });

render();
requestAnimationFrame(tick);
setInterval(save, 5000);
})();
</script>
