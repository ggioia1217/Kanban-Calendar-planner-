      t.contacts = t.contacts || []; t.contacts.unshift({who:b.who.name, how:reachLabel(S._blk.reach) + (n ? ': ' + n : ''), when});
      closeSheet(); render(); save(); toast('Contact logged', reachLabel(S._blk.reach) + ' ' + b.who.name + (n ? ' · ' + n : '')); break; }
    case 'blkclear': { const t = byId(el.dataset.task), b = t.roadblock, when = DAYS[S.day] + ' ' + fmt(S.now);
      const g = t.goalId && goalById(t.goalId), root = g && rootOf(g);
      if (root){ root.updates = root.updates || []; root.updates.unshift({who:'You', when, clear:true, text:'"' + t.title + '" is moving again.'}); }
      if (b.sentTo.length) note('You told ' + b.sentTo.length + ' people "' + t.title + '" is moving again', b.sentTo.join(', '), 'ok', {task:t.id});
      S.rewards.cleared = (S.rewards.cleared || 0) + 1; addSticker('unblocker');
      delete t.roadblock; save(); render(); if ($('#sheetRoot').dataset.kind === 'task') openTask(t);
      toast('Back on track', b.sentTo.length ? 'Everyone you told about the roadblock got the update.' : 'Roadblock cleared.'); break; }
    case 'tstyle': S.settings.textStyle = el.dataset.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); gPreview(); save(); applyGram(); return;
    case 'fread': { const t = byId(el.dataset.id); openFocusReader(t.notes, t.title); return; }
    case 'frtoggle': if (!freader) return; if (!freader.playing && freader.i >= freader.chunks.length - 1) freader.i = 0; freader.playing = !freader.playing; frShow(); frSchedule(); return;
    case 'frnext': if (!freader) return; freader.i = Math.min(freader.chunks.length - 1, freader.i + 1); frShow(); frSchedule(); return;
    case 'frprev': if (!freader) return; freader.i = Math.max(0, freader.i - 1); frShow(); frSchedule(); return;
    case 'frspeed': if (!freader) return; freader.wpm = S.settings.readWpm = +el.dataset.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); frSchedule(); return;
    case 'lttag': S._ltTag = el.dataset.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); updLadder(); return;
    case 'ltfirst': S._ltFirst = +el.dataset.v; el.parentElement.querySelectorAll('[data-act="ltfirst"]').forEach(b => b.setAttribute('aria-pressed', b === el)); if ($('#ltCustom')) $('#ltCustom').value = ''; updLadder(); return;
    case 'ltsave': { const text = $('#ltText').value.trim(); if (!text){ $('#ltText').focus(); return; }
      const first = S._ltFirst || 60, due = dueWhen(S.day, S.now, first); S.settings.laterFirst = first;
      S.later.push({id:newId('lt'), text, tag:S._ltTag || 'any', first, media:$('#ltMedia').value.trim(), ctx:S._ltCtx || captureContext(), snoozes:0, dueDay:due.d, dueMin:due.m, status:'open'});
      closeSheet(); updateLaterBadge(); save(); toast('In your pocket', 'Back to what you were doing. First reminder in ' + waitTxt(first) + (S._ltTag === 'any' ? '' : ' of ' + S._ltTag + ' hours') + '.'); break; }
    case 'later': openLater(); break;
    case 'lfilter': S.laterFilter = el.dataset.v; openLater(); break;
    case 'lnow': { const n = (S.later || []).find(x => x.status === 'open'); if (n){ n.dueDay = S.day; n.dueMin = S.now; n.tag = 'any'; closeLaterPop(); showLaterPop(n); } break; }
    case 'lsnooze': { const n = S.later.find(x => x.id === el.dataset.id); if (!canSnooze(n)) return; n.snoozes++; const w = laterWait(n), due = dueWhen(S.day, S.now, w); n.dueDay = due.d; n.dueMin = due.m;
      closeLaterPop(); save(); toast(canSnooze(n) ? 'Snoozed ' + waitTxt(w) : 'Last snooze: ' + waitTxt(w), canSnooze(n) ? 'Next time the wait is half as long.' : 'Next time you\'ll decide: keep it or toss it.'); if (page && page.kind === 'later') openLater(); break; }
    case 'ltask': { const n = S.later.find(x => x.id === el.dataset.id); closeLaterPop(); S.pendingLater = n.id; openAdd(null); $('#fTitle').value = n.text; if (n.ctx.ctx) $('#fCtx').value = n.ctx.ctx; else if (n.tag !== 'any') $('#fCtx').value = n.tag; break; }
    case 'lattach': { const n = S.later.find(x => x.id === el.dataset.id); closeLaterPop();
      const list = S.tasks.filter(t => isMine(t) && !t.done).sort((a, b) => (a.id === n.ctx.taskId ? -1 : b.id === n.ctx.taskId ? 1 : (a.day ?? 9) - (b.day ?? 9)));
      openSheet(`<h2>Add to a task</h2><p class="note">"${esc(n.text)}"</p><div class="list" style="gap:6px;margin-top:10px">${list.slice(0, 12).map(t => `<div class="trow" style="grid-template-columns:1fr auto auto"><span class="tt">${esc(t.title)}${t.id === n.ctx.taskId ? '<small>You were working on this when you wrote it</small>' : ''}</span><button class="btn small" data-act="lattachto" data-id="${n.id}" data-task="${t.id}" data-as="note">As a note</button><button class="btn small" data-act="lattachto" data-id="${n.id}" data-task="${t.id}" data-as="step">As a step</button></div>`).join('')}</div>
        <div class="actions"><div class="spacer"></div><button class="btn ghost" data-close="1">Cancel</button></div>`, 'lattach'); break; }
    case 'lattachto': { const n = S.later.find(x => x.id === el.dataset.id), t = byId(el.dataset.task);
      if (el.dataset.as === 'step') t.steps.push({t:n.text}); else t.notes = (t.notes ? t.notes + '\n' : '') + 'Later note: ' + n.text + ' (' + ctxChips(n.ctx, n.media).join(' · ') + ')';
      n.status = 'attached'; n.attachedTo = t.title; closeSheet(); render(); save(); toast('Added to "' + t.title + '"', el.dataset.as === 'step' ? 'It\'s a new step.' : 'It\'s in the task notes.'); if (page && page.kind === 'later') openLater(); break; }
    case 'ltoss': { const n = S.later.find(x => x.id === el.dataset.id); document.querySelectorAll(`[data-paper="${n.id}"]`).forEach(x => x.classList.add('tossed'));
      setTimeout(() => { n.status = 'tossed'; closeLaterPop(); save(); updateLaterBadge(); if (page && page.kind === 'later') openLater(); }, 520); toast('Tossed', 'One less thing to carry.'); break; }
    case 'lighttoggle': { const d = +el.dataset.day;
      if (S.light[d]){ unlightenDay(d); toast('Back to a regular day', 'Moved tasks came back.'); }
      else { const r = lightenDay(d); toast(d === S.day ? 'Light day' : 'Light day planned for ' + DAYS[d], (r.moved ? r.moved + ' task' + (r.moved > 1 ? 's' : '') + ' moved to ' + DAYS[r.target] + '. ' : '') + 'Only essentials, longer breaks, softer reminders.'); }
      render(); break; }
    case 'mused': useMantra(S.day); render(); if (page && page.kind === 'mantras') openMantras(); break;
    case 'mantras': openMantras(); break;
    case 'myear': openMantraYear(); break;
    case 'mshare': openShareStory(+el.dataset.i); break;
    case 'msharesave': { const st = S.mantraStories[+el.dataset.i]; st.sharedWith = [...document.querySelectorAll('.shareTo:checked')].map(x => x.value); closeSheet(); save();
      toast(st.sharedWith.length ? 'Shared with ' + st.sharedWith.join(', ') : 'Kept private', 'Everything else stays private.'); if (page && page.kind === 'mantras') openMantras(); break; }
    case 'nightly': openNightly(); break;
    case 'nyes': useMantra(S.day); openNightly(); break;
    case 'nno': toast('No problem', 'Tomorrow is another chance to try it.'); el.parentElement.innerHTML = '<span class="note">Marked: not today.</span>'; return;
    case 'nfinish': { const note = $('#nNote') && $('#nNote').value.trim(), story = $('#nStory') && $('#nStory').value.trim();
      if (note) S.mantraStories.unshift({week:'This week · ' + DAYS[S.day], id:thisMantra()[0], text:note, sharedWith:[]});
      if (story) S.mantraStories.unshift({week:'This week', id:thisMantra()[0], text:story, sharedWith:[]});
      closeSheet(); if (S.day < 6) endDay(); else { save(); toast('Week saved', story ? 'Your story is saved privately in Mantras.' : 'See you next week.'); } break; }
    case 'otherwork': closeNewMenu(); openOtherWork(); break;
    case 'saveother': { const w = $('#owWhat').value.trim(); if (!w){ $('#owWhat').focus(); return; } const mins = readEst('owT') || 30, d = +$('#owDiff').value;
      S.log.push({title:w, day:S.day, kind:'other', mins, pts: d * Math.max(1, Math.round(mins / 30))}); closeSheet(); render();
      confetti(innerWidth / 2, innerHeight / 3, 40, 5); chime(false); toast('Logged: ' + w, fmtDur(mins) + ' counted toward today and your effort points.'); break; }
    case 'kudos': openKudos(el.dataset.pid, el.dataset.for); break;
    case 'kchip': { const t = $('#kText'); t.value = t.value ? t.value + ' ' + el.dataset.v + '.' : el.dataset.v + '.'; t.focus(); return; }
    case 'sendkudos': { const t = $('#kText').value.trim(); if (!t){ $('#kText').focus(); return; } const pid = el.dataset.pid, pp = S.org.find(x => x.id === pid), mgr = pp && S.org.find(x => x.id === pp.mgr);
      S.kudos.push({to:pid, from:'You', text:t, when:DAYS[S.day], forWhat:el.dataset.for}); closeSheet();
      note('You sent kudos to ' + (pp ? pp.name : pid), mgr ? (mgr.id === 'p-you' ? 'Saved to their profile and your team view.' : mgr.name + ' was copied. Saved to their profile for reviews.') : 'Saved to their profile.', 'star', {page:'profile'});
      confetti(innerWidth / 2, innerHeight / 3, 50, 6); chime(false); toast('Kudos sent to ' + (pp ? pp.name : pid), mgr && mgr.id !== 'p-you' ? mgr.name + ' was copied.' : 'Saved to their profile.'); break; }
    case 'copykudos': { const txt = S.kudos.filter(k => k.to === 'p-you').map(k => '- ' + k.text + ' (' + k.from + ', ' + k.when + ')').join('\n');
      try { navigator.clipboard.writeText(txt).then(() => toast('Copied', 'Paste them into your review notes.'), () => toast('Couldn\'t copy automatically', 'Select the kudos below and copy them.')); } catch(e){ toast('Couldn\'t copy automatically', 'Select the kudos below and copy them.'); } break; }
    case 'goaltab': openGoals(el.dataset.tab); break;
    case 'flowtab': openFlows(el.dataset.tab); break;
    case 'ideacat': S.ideaCat = el.dataset.cat; openTemplates(); break;
    case 'lbcat': S.lbCat = el.dataset.cat; openLeaderboard(); break;
    case 'setcue': S.settings.cue = +el.dataset.cue; render(); openProfile(); break;
    case 'readall': S.notes.forEach(n => n.read = true); save(); openInbox(); break;
    case 'opennote': { const n = S.notes[+el.dataset.i]; n.read = true; save(); updateBadges(); const o = n.open || {};
      if (o.task){ const t = byId(o.task); if (t){ if (page) closePage(); openTask(t); } } else if (o.page === 'goals') openGoals(o.tab); else if (o.page === 'flows') openFlows(o.tab); else if (o.page === 'profile') openProfile(); else if (o.flow){ const g = goalById(o.flow); if (g) openFlow(g.title, 'Each stage is a sub-goal, placed in the lane of whoever owns it.', goalStages(g), '', [['Board', 'board'], ['Notifications', 'inbox']]); } else openInbox(); break; }
    case 'useidea': { const {root, created} = instantiate(tpl, ''); render(); openGoals('own'); toast('Added: ' + root.title, created + ' routine' + (created > 1 ? 's' : '') + ' on your board, starting today.'); break; }
    case 'savenewgoal': { const t = $('#ngTitle').value.trim(); if (!t){ $('#ngTitle').focus(); return; }
      const g = {id:newId('g'), title:t, parent:null, owner:'me', horizon:{n:Math.max(1, +$('#ngN').value || 1), unit:$('#ngU').value}, start:S.day, why:$('#ngWhy').value.trim()};
      S.goals.push(g); let n = 0; if ($('#ngAi').checked) n = suggestRoutines(g); closeSheet(true); render(); openGoals('own');
      toast('Goal created: ' + t, n ? n + ' routine sub-goals added. Their tasks start today.' : 'Add sub-goals and tasks from its card.'); break; }
    case 'requpd': { const st = goalById(el.dataset.goal), who = personFor(st.role); st.updReq = stamp(); st.updReply = null;
      note('You asked ' + who + ' for an update', '"' + st.title + '" in ' + (rootOf(st) || {}).title, 'ask', {page:'goals', tab:'waiting'});
      toast('Update requested', who + ' got a notification.'); openGoals('waiting');
      setTimeout(() => { st.updReply = {who, text: REPLIES[st.role] || 'Working on it. Should be done in a day or two.', when: stamp()};
        note(who + ' replied about "' + st.title + '"', st.updReply.text, 'reply', {page:'goals', tab:'waiting'}); toast(who + ' replied', st.updReply.text);
        if (page && page.kind === 'goals') openGoals(); }, 4000); break; }
    case 'library': openFlows('templates'); break;
    case 'savegoal': case 'savesub': {
      const isGoal = a === 'savegoal', inp = isGoal ? $('#newGoal') : $('#newSub'), v = inp.value.trim(); if (!v){ inp.focus(); return; }
      const pre = isGoal ? 'ng' : 'ns', n = Math.max(1, +$('#'+pre+'N').value || 1), unit = $('#'+pre+'U').value;
      S.goals.push({id:newId('g'), title:v, parent: isGoal ? null : inp.dataset.parent, horizon:{n, unit}, start:S.day});
      openGoals(); save(); toast(isGoal ? 'Goal added: ' + n + ' ' + unit : 'Sub-goal added', isGoal ? 'Try "Suggest routines" to break it into daily steps.' : 'Add tasks to it with "+ Task".'); break; }
    case 'addsub': {
      document.querySelectorAll('.subrow').forEach(n => n.remove());
      const row = document.createElement('div'); row.className = 'actions subrow'; row.style.marginTop = '6px';
      row.innerHTML = `<input id="newSub" class="inp" data-parent="${gid}" placeholder="Sub-goal of ${esc(goalById(gid).title)}" style="flex:1;min-width:160px;width:auto">${horizonInputs('ns')}<button class="btn small primary" data-act="savesub">Add</button>`;
      $('#ga-' + gid).after(row); $('#newSub').focus(); break; }
    case 'addgtask': openAdd(gid); break;
    case 'suggest': { const g = goalById(gid), n = suggestRoutines(g); render(); openGoals(); toast('Added ' + n + ' routine sub-goals to ' + g.title, 'Each one has a small daily or weekly task on your board.'); break; }
    case 'savetpl': { const tp = templateFromGoal(goalById(gid)); save(); toast('Saved as a template: ' + tp.name, 'Find it under My templates in the Library.'); break; }
    case 'goalflow': { const g = goalById(gid), from = page && page.kind === 'flows' ? [['Board', 'board'], ['Flows', 'flows']] : [['Board', 'board'], ['My goals', 'goals']]; openFlow(g.title, (g.owner && g.owner !== 'me' ? 'Started by ' + ownerName(g.owner) + '. ' : '') + 'Each stage is a sub-goal, placed in the lane of whoever owns it. Dashed arrows are hand-offs.', goalStages(g), g.fromTemplate ? `<button class="btn" data-act="editflow" data-tpl="${g.fromTemplate}">Open template</button>` : '', from); break; }
    case 'tplflow': openFlow(tpl.name, scopeLabel(tpl) + ' · ' + horizonLabel(tpl) + '. ' + (tpl.desc||''), ensureStageIds(tpl).stages.map(s => ({...s})), `<button class="btn" data-act="editflow" data-tpl="${tpl.id}">${canStructure(tpl) ? 'Edit' : 'Suggest changes'}</button>${isPublished(tpl) ? `<button class="btn primary" data-act="tpluse" data-tpl="${tpl.id}">Use this process</button>` : ''}`); break;
    case 'tpluse': {
      if ($('#tplFor')){ const {root, created} = instantiate(tpl, $('#tplFor').value.trim()); closeSheet(); render(); openGoals(); toast('Created: ' + root.title, created + ' tasks across ' + tpl.stages.length + ' stages. Yours are on your board.'); break; }
      const host = $('#tu-' + tpl.id) || el.closest('.actions');
      const row = document.createElement('div'); row.className = 'actions'; row.style.marginTop = '6px';
      row.innerHTML = `<input id="tplFor" class="inp" placeholder="${tpl.scope==='company'?'Who is it for? e.g. Jordan Lee':'Optional name, e.g. by spring'}" style="flex:1;min-width:150px;width:auto"><button class="btn small primary" data-act="tpluse" data-tpl="${tpl.id}">Create goal</button>`;
      host.after(row); $('#tplFor').focus(); break; }
    case 'pushlater': {
      const {overflow} = schedule(S.day); let n = 0;
      overflow.filter(t => t.due == null || t.due > S.day).sort((a,b) => (b.due ?? 99) - (a.due ?? 99)).forEach(t => { if (S.day < 6){ t.day = S.day + 1; n++; } });
      render(); toast(n ? 'Moved ' + n + ' task' + (n>1?'s':'') + ' to tomorrow' : 'Nothing could move', n ? 'Tasks due soonest stayed on today.' : 'Everything left is due today.'); break; }
    case 'breakdown': toast('Tip', 'Add a smaller first step below, something you can do in 5 minutes.'); $('#newStep') && $('#newStep').focus(); break;
    case 'delegate': toast('Hand-offs come with team workspaces', 'Phase 6 in the roadmap. Company processes in the Library preview how it works.'); break;
    case 'resched': sheetTask.day = Math.min(6, S.day + 2); sheetTask.rolled = 0; closeSheet(); render(); toast('Moved to ' + DAYS[sheetTask.day], 'Rollover count reset.'); break;
    case 'drop': S.tasks = S.tasks.filter(t => t !== sheetTask); if (S.currentId === sheetTask.id) S.currentId = null; closeSheet(); render(); toast('Dropped', 'Letting go is a valid choice.'); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || el.dataset.step === undefined) return;
  const t = byId(el.dataset.task), i = +el.dataset.step;
  if (el.checked) checkStep(t, i, el); else uncheckStep(t, i);
  const root = $('#sheetRoot');
  if (root.dataset.kind === 'task' && root.dataset.task === t.id) openTask(t);
  else if (page && page.refresh && page.kind !== 'builder') page.refresh();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ if ($('#newMenu') && !$('#newMenu').hidden) closeNewMenu(); else if ($('#sheetRoot').innerHTML) closeSheet(); else if ($('#drawerRoot').innerHTML) closeDrawer(); else if (page) goBack(); }
  if (ev.key === 'Enter' && ev.target.id === 'newGoal') $('[data-act="savegoal"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newSub') $('[data-act="savesub"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'newStep') $('[data-act="addstep"]').click();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('card') && ev.target.dataset.id){ ev.preventDefault(); openTask(byId(ev.target.dataset.id)); }
});
$('#menuBtn').onclick = openDrawer;
$('#bellBtn').onclick = openInbox;
$('#laterBtn').onclick = openLaterCapture;
$('#lockBtn').onclick = () => drawLock(true);
$('#appBtn').onclick = () => { const c = shieldCfg(), app = c.apps[0] || 'Instagram';
  if (S.brk && S.brk.k === 'apps') toast(app + ' opened (demo)', 'Enjoy, it\'s your earned app time. ' + Math.ceil(S.brk.min - S.brk.spent) + ' min left.');
  else if (shieldActive()) openShield(app); else toast(app + ' opened (demo)', c.mode === 'off' ? 'The shield is off. Turn it on in Settings.' : 'The shield only works while a task is running. Start a task, then try again.'); };
$('#newUserBtn').onclick = () => { S = seedFresh(); S.templates.forEach(ensureStageIds); initRuntime(); render.scrolled = false; closeSheet(true); closeDrawer(); if (page) closePage(); render(); openOnboarding(); };
document.addEventListener('change', ev => { if (ev.target.id === 'bundleIn'){ S.rewards.bundle = ev.target.value.trim(); save(); render(); toast('Saved', S.rewards.bundle ? 'Shown on tasks you\'ve put off.' : 'Pairing turned off.'); } });
$('#newBtn').onclick = ev => { ev.stopPropagation(); const m = $('#newMenu'); if (m.hidden) openNewMenu(); else closeNewMenu(); };
$('#clearBtn').onclick = () => { // demo shortcut: finish everything planned today so "Get ahead" appears
  S.tasks.filter(t => t.day === S.day && isMine(t) && !t.done && t.status !== 'waiting').forEach(t => {
    S.log.push({title:t.title, day:S.day, taskId:t.id, kind:'task'}); t.completions = (t.completions||0) + 1;
    if (t.cadence){ t.day += t.cadence.every; t.steps.forEach(s => { s.done = false; delete s.at; }); t.missed = 0; if (t.due != null) t.due = t.day; }
    else { t.done = true; t.doneDay = S.day; t.steps.forEach(s => { s.done = true; }); }
    t.spent = 0; t.status = null;
  });
  Object.assign(S, {currentId:null, paused:false, brk:null, breakDue:null, workSince:0});
  closeSheet(); render(); toast('Today cleared (demo)', 'Now try "Get ahead" at the top of Today.');
};
$('#playBtn').onclick = () => { S.running = !S.running; render(); };
$('#endDayBtn').onclick = openNightly;
$('#resetBtn').onclick = () => { S = seed(); S.templates.forEach(ensureStageIds); initRuntime(); render.scrolled = false; closeSheet(true); closeDrawer(); if (page) closePage(); render(); toast('Demo reset'); };
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { render(); if (page && page.kind === 'builder') renderBuilder(); else if (page && page.kind === 'flowview') drawFlow(); }, 150); });

initRuntime();
render();
requestAnimationFrame(tick);
setInterval(save, 5000);
})();
</script>
