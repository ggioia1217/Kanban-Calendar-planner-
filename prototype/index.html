<meta charset="utf-8">
<title>Cueue Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header + board (7 day columns in landscape, one day in portrait) + demo clock bar.
   Card color = what the card needs from you: Now (indigo), Due today (amber), Late (red), Break (green), Waiting (grey).
   Edge light: a glow runs along each visible card's top edge; color, speed and thickness rise with urgency. */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#172033; --muted:#5D667A; --line:#D8DDE7;
  --accent:#3B55F0; --accent-soft:#E3E8FE; --accent-ink:#FFFFFF;
  --work:#0F8B8D; --home:#D9702A; --ok:#169A63; --warn:#D99A0B; --hot:#E0434A; --rest:#1E9E6A; --violet:#8A4FD8; --paper:#FFFBEE; --paper-ink:#2B2A22; --crease:rgba(60,45,0,.09);
  --event-bg:#E2E6EE; --event-ink:#4A5366; --pie-track:#E6E9F0; --scrim:rgba(15,20,32,.45);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --amp:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F; --violet:#B38BFF; --paper:#2F2D25; --paper-ink:#F1EBD8; --crease:rgba(255,245,210,.08);
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --surface-2:#1D2331; --ink:#E7EBF3; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8193FF; --accent-soft:#252C4A; --accent-ink:#0E121A;
  --work:#3CC6C4; --home:#F0954F; --ok:#3CCB8A; --warn:#F2C04B; --hot:#FF6B70; --rest:#46D08F; --violet:#B38BFF; --paper:#2F2D25; --paper-ink:#F1EBD8; --crease:rgba(255,245,210,.08);
  --event-bg:#222838; --event-ink:#B3BBCB; --pie-track:#2B3245; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.rest{background:var(--rest);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-bottom:1px solid var(--line);font-size:14px}

/* Board */
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{flex:1 0 230px;min-width:0;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;min-height:0}
.col.today{flex-basis:320px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.board.single .col{flex:1 1 auto;max-width:640px;margin-inline:auto}
.col.past{opacity:.75}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.colhead .date{color:var(--muted);font-size:13px;font-weight:500}
.colhead .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.colhead .nav{display:flex;gap:4px}
.colbody{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.colbody > *{flex-shrink:0}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dayprog{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dayprog .row{display:flex;justify-content:space-between;color:var(--muted)}
.dayprog .row b{color:var(--ink)}

.bar{height:8px;border-radius:999px;background:var(--pie-track);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s ease}
.bar.thin{height:4px}

/* Big panels */
.panel{position:relative;overflow:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.panel.restp{border-color:var(--rest);background:color-mix(in srgb,var(--rest) 10%,var(--surface))}
.panel.latep{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 7%,var(--surface))}
.panel .ph{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.panel .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--accent)}
.panel.restp .tag{color:var(--rest)} .panel.latep .tag{color:var(--hot)}
.panel h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.panel .main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.panel .words{font-weight:600}
.panel .sub{font-size:13px;color:var(--muted);line-height:1.4}
.panel .row{display:flex;gap:6px;flex-wrap:wrap}
.panel .steps li.nextup{background:var(--surface);border-radius:8px;font-weight:600}
.checkin{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.brkopt{border:1px solid color-mix(in srgb,var(--rest) 40%,var(--line));background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.brkopt b{font-size:14px} .brkopt span{font-size:12px;color:var(--muted)}
.brkopt.star{border-color:var(--rest);box-shadow:0 0 0 2px color-mix(in srgb,var(--rest) 30%,transparent)}

/* Cards */
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 0 12px;cursor:pointer;
  transition:opacity .6s ease, box-shadow .3s ease;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card.s-due{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.card.s-late{background:color-mix(in srgb,var(--hot) 10%,var(--surface))}
.card.s-wait{background:var(--surface-2);border-style:dashed}
.card .top{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card .time{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.ctx{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.ctx::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ctx.work{color:var(--work)} .ctx.home{color:var(--home)}
.diff{margin-left:auto;display:inline-flex;gap:2px}
.diff i{width:5px;height:10px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--ink)}
.card .title{grid-column:1/2;font-weight:700;line-height:1.25;font-size:15px;min-width:0;overflow-wrap:anywhere}
.card .next{grid-column:1/2;font-size:13.5px;color:var(--muted);line-height:1.3;min-width:0;overflow-wrap:anywhere;margin-top:2px}
.card .next b{color:var(--ink);font-weight:600}
.nextck{display:flex;gap:8px;align-items:flex-start;cursor:pointer;color:var(--ink);font-weight:600}
.nextck input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ok)}
.card .ready{color:var(--ok);font-weight:700}
.verify{grid-column:2;grid-row:2/4;align-self:center;border:0;background:var(--ok);color:#fff;font-weight:700;font-size:13px;padding:7px 11px;border-radius:999px}
.card .meta{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.card .meta svg{width:14px;height:14px}
.card .prog{grid-column:1/-1;margin:8px -10px 0 -12px;height:4px;background:var(--pie-track)}
.card .prog i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.hot{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.okc{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.card.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.2}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}

/* Pie timer */
.pie{--p:0;--fill:var(--hot);width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--fill) calc(var(--p)*1turn),var(--pie-track) 0);flex:none}
.pie.big{width:96px;height:96px}
.pie.rest{--fill:var(--rest)}
.pie.over{box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 45%,transparent)}
.pie.off{display:none}

/* Event + prep + planned break */
.event{background:var(--event-bg);color:var(--event-ink);border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:pointer}
.event .time{font-family:var(--font-mono);font-size:11px}
.event b{display:block;color:var(--ink);font-weight:600}
.event.pastev{opacity:.55}
.prep{background:transparent;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink)}
.prep .tag{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.brkcard{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;cursor:pointer;
  background:color-mix(in srgb,var(--rest) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--rest) 55%,var(--line));text-align:left}
.brkcard svg{width:20px;height:20px;color:var(--rest);flex:none}
.brkcard b{display:block;font-size:14px}
.brkcard span{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px}

/* Cue levels: outer glow + periodic shake */
.card.lvl-1{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent)}
.card.lvl-2{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 65%,transparent)}
.card.lvl-3{box-shadow:0 0 0 2px color-mix(in srgb,var(--hot) 65%,transparent)}
.card.lvl-4{box-shadow:0 0 0 3px var(--hot)}
.motion .card.lvl-2{animation:shake 5s ease-in-out infinite}
.motion .card.lvl-3{animation:shake 3s ease-in-out infinite;--k:1.6}
.motion .card.lvl-4{animation:shake 1.8s ease-in-out infinite;--k:2.4}
@keyframes shake{
  0%,14%,100%{transform:translateX(0) rotate(0)}
  2%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.6deg)}
  4%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.6deg)}
  6%{transform:translateX(calc(var(--amp)*var(--k,1)*-1)) rotate(-.4deg)}
  8%{transform:translateX(calc(var(--amp)*var(--k,1))) rotate(.4deg)}
  10%{transform:translateX(calc(var(--amp)*var(--k,1)*-.5))}
}
/* Edge light: travels the top edge left to right, brightest at the card's center, fades out at the right */
.card,.panel{--ec:var(--accent);--es:9s;--eh:2px;--eg:5px}
.card.lvl-1{--ec:var(--warn);--es:7s;--eh:3px;--eg:6px}
.card.lvl-2{--ec:#F59E0B;--es:4.5s;--eh:3px;--eg:9px}
.card.lvl-3{--ec:var(--hot);--es:2.8s;--eh:4px;--eg:11px}
.card.lvl-4{--ec:var(--hot);--es:1.6s;--eh:5px;--eg:15px}
.panel{--ec:var(--accent);--es:5s;--eh:3px;--eg:9px}
.panel.restp{--ec:var(--rest);--es:3.5s}
.panel.latep{--ec:var(--hot);--es:2s;--eh:4px;--eg:12px}
.card::after,.panel::after{content:"";position:absolute;top:0;left:0;width:46%;height:var(--eh);pointer-events:none;opacity:0;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,transparent 0%,var(--ec) 30%,color-mix(in srgb,var(--ec) 55%,#fff) 50%,var(--ec) 70%,transparent 100%);
  box-shadow:0 0 var(--eg) calc(var(--eh) / 2) color-mix(in srgb,var(--ec) 70%,transparent);transform:translateX(-100%)}
.edge-on .inview::after{animation:edge var(--es) linear var(--ed,0s) infinite}
@keyframes edge{
  0%{transform:translateX(-100%);opacity:0}
  6%{opacity:.25}
  24%{transform:translateX(59%);opacity:1}
  42%{transform:translateX(217%);opacity:0}
  100%{transform:translateX(217%);opacity:0}
}

/* Demo clock bar */
.simbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line);font-size:13px}
.simbar .clock{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;font-weight:500}
.simbar .tagline{color:var(--muted)}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
.sheet.wide{max-width:980px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;background:none;border:0;padding:0;text-align:left}
button.crumb:hover{color:var(--accent);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.steps li.done .t{color:var(--muted);text-decoration:line-through}
.steps input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.steps label{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
.stype{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.when{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
details.donesteps{margin-top:8px}
details.donesteps summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;padding:4px 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;width:100%}
.estrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.quote{background:var(--surface-2);border-left:3px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--muted)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13.5px}
.sw{width:28px;height:18px;border-radius:6px;border:1px solid var(--line)}
a{color:var(--accent)}

/* Avatars for people and roles */
.av{--c:var(--accent);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.av i{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.25);flex:none}

/* Goals */
.ring{--p:0;--rc:var(--ok);position:relative;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78% 100%),conic-gradient(var(--rc) calc(var(--p)*1turn),var(--pie-track) 0)}
.ring.sm{width:26px;height:26px;font-size:0}
.gcard{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface);margin-bottom:14px}
.ghead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.gtitle{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0}
.gmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.why{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink)}
.tline{margin-top:12px}
.tline .bar{height:10px;overflow:visible}
.tline .bar i{border-radius:999px}
.tline .elapsed{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.tline .legendrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.gchildren{margin:12px 0 0 12px;padding-left:16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.gsub{position:relative}
.gsub::before{content:"";position:absolute;left:-18px;top:16px;width:14px;height:2px;background:var(--line)}
.grow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.grow b{font-size:15px}
.grow .pct{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:14px}
.trow .tic{width:18px;height:18px;color:var(--muted)}
.trow .tic svg{width:18px;height:18px}
.trow .tt{min-width:0;overflow-wrap:anywhere}
.trow .tt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.trow.isdone{opacity:.6}
.gacts{display:flex;gap:6px;flex-wrap:wrap}

/* Template library */
.tpl{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tpl h3{margin:0;font-family:var(--font-display);font-size:18px}
.tpl .lanes{display:flex;gap:8px;flex-wrap:wrap}
.scope{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}

/* Workflow diagram (swimlanes) */
.flowwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);margin-top:10px}
.flow{position:relative;display:grid;gap:0;min-width:max-content;padding:10px 14px 10px 0}
.lane{display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:13px;font-weight:700;position:sticky;left:0;z-index:2;background:var(--surface-2);border-right:1px solid var(--line)}
.laneband{border-bottom:1px dashed var(--line);z-index:0}
.fcell{position:relative;z-index:2;margin:10px 18px;display:flex;flex-direction:column;gap:8px;align-self:center}
.fnode{position:relative;z-index:2;margin:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:4px;align-self:center}
.fnode b{font-size:14px;line-height:1.2}
.fnode .fm{color:var(--muted);font-size:12px}
.fnode.st-done{border-color:var(--ok)}
.fnode.st-active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fnode.st-waiting{border-style:dashed}
.fnode.st-others{border-color:color-mix(in srgb,var(--violet) 55%,var(--line))}
.flowsvg{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
.flowsvg path.link{fill:none;stroke:var(--muted);stroke-width:1.6}
.flowsvg path.handoff{fill:none;stroke:var(--violet);stroke-width:2;stroke-dasharray:5 4}
.flowsvg .ah{fill:var(--muted)} .flowsvg .ahv{fill:var(--violet)}
.flowkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.flowkey span{display:inline-flex;align-items:center;gap:6px}
.flowkey i{display:inline-block;width:22px;height:0;border-top:2px solid var(--muted)}
.flowkey i.h{border-top:2px dashed var(--violet)}

/* Get ahead */
.chip.ahead{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,var(--line))}
.panel.aheadp{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--surface));--ec:var(--violet)}
.panel.aheadp .tag{color:var(--violet)}
/* Flow builder */
.fnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fnode.editable{cursor:pointer}
.ntools{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.ntools button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;min-width:26px;height:24px;font-size:12px;line-height:1;padding:0 4px;color:var(--muted)}
.ntools button:hover{color:var(--ink);border-color:var(--accent)}
.fnode.ghost{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;min-height:56px;cursor:pointer;font-weight:600}
.fnode.ghost:hover{border-color:var(--accent);color:var(--accent)}
.fnode .ft{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.depgrid{display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface-2);cursor:pointer}
.dep small{color:var(--muted)}
.dep:has(input:checked){border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,var(--surface))}
.stageed{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--surface)}
.handoff-note{font-size:13.5px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--violet) 10%,var(--surface));margin:6px 0 10px}
.btask{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:6px;font-size:14px}
.btask small{color:var(--muted)}
.lockmsg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:8px 0}
.lockmsg svg{width:16px;height:16px;flex:none}
/* Org chart */
.org{list-style:none;margin:0;padding:0}
.org .org{margin-left:18px;padding-left:16px;border-left:2px solid var(--line)}
.org li{margin:8px 0;position:relative}
.org .org > li::before{content:"";position:absolute;left:-16px;top:24px;width:14px;height:2px;background:var(--line)}
.op{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);flex-wrap:wrap;max-width:100%}
.op.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.op b{font-size:14px} .op small{color:var(--muted);font-size:12px;display:block}
.tablewrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.ptable th,.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{font-size:12px;color:var(--muted);font-weight:700}
.ptable th.cur{color:var(--accent)}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}

/* Header controls */
.iconbtn{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:999px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;font-style:normal;line-height:1}
.newwrap{position:relative}
.newmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:35;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;width:min(270px,calc(100vw - 24px));display:flex;flex-direction:column}
.newmenu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.newmenu button svg{width:18px;height:18px;color:var(--accent);grid-row:1/3}
.newmenu button:hover,.newmenu button:focus-visible{background:var(--surface-2)}
.newmenu b{font-size:14px} .newmenu span{font-size:12px;color:var(--muted)}
/* Phone tab bar */
.tabbar{display:none;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:32;
  padding:3px max(8px,env(safe-area-inset-left,0px)) calc(3px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabbar.on{display:flex}
.tabbar button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:10px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .badge{top:0;right:2px}
/* Menu drawer */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:55;display:flex}
.drawer{width:min(330px,88vw);height:100%;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;gap:2px;animation:slidein .22s ease;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@keyframes slidein{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface-2);text-align:left;width:100%;margin-bottom:6px}
.profile b{display:block;font-size:16px} .profile small{color:var(--muted);font-size:12.5px;display:block}
.bigav{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.mgroup{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 10px 2px}
.mitem{display:flex;align-items:center;gap:12px;border:0;background:none;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:15px;font-weight:600}
.mitem:hover,.mitem[aria-current="page"]{background:var(--surface-2)}
.mitem svg{width:20px;height:20px;color:var(--muted);flex:none}
.mitem[aria-current="page"] svg{color:var(--accent)}
.cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cnt.hot{background:color-mix(in srgb,var(--hot) 14%,var(--surface));color:var(--hot)}
/* Full-screen pages */
.page{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,0px);background:var(--bg);z-index:30;display:flex;flex-direction:column;animation:fadein .16s ease;
  padding-top:env(safe-area-inset-top,0px)}
.page.still{animation:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted);min-width:0}
.crumbs button{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--muted);font-weight:600}
.crumbs button:hover{color:var(--accent);background:var(--surface-2)}
.crumbs b{color:var(--ink);font-size:13.5px;padding:0 4px}
.pagebody{flex:1;min-height:0;overflow-y:auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1040px;margin:0 auto}
.page h1{font-family:var(--font-display);font-size:28px;margin:0 0 4px;letter-spacing:-.015em;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 6px;max-width:70ch;line-height:1.45}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px}
.list{display:flex;flex-direction:column;gap:10px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface)}
.box h3{margin:0;font-family:var(--font-display);font-size:18px;letter-spacing:-.01em}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.stat b{font-family:var(--font-display);font-size:28px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.empty2{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
/* Notifications */
.nitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.nitem.unread{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.nitem .ni{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.nitem .ni svg{width:16px;height:16px}
.nitem b{font-size:14.5px;display:block} .nitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.nitem .when{white-space:nowrap}
/* Waiting / update requests */
.waitcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.reply{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,var(--surface));font-size:13.5px}
/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:grid;grid-template-columns:30px auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface-2)}
.lbrow.you{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.lbrow .rk{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lbrow .val{font-weight:700;font-variant-numeric:tabular-nums}
.lbbar{height:6px;border-radius:999px;background:var(--pie-track);overflow:hidden;margin-top:5px}
.lbbar i{display:block;height:100%;background:var(--violet);border-radius:999px}
.feed{display:flex;flex-direction:column;gap:8px}
.feed div{display:flex;gap:10px;align-items:center;font-size:14px}
.feed small{color:var(--muted);margin-left:auto;white-space:nowrap}
/* Builder (full screen) */
.bwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px}
@media (max-width:880px){.bwrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}}
.bcanvas{min-width:0;min-height:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px))}
.bside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px}
@media (max-width:880px){.bside{border-left:0;border-top:1px solid var(--line);max-height:46vh}}
.bside h3{margin:0 0 4px;font-family:var(--font-display);font-size:18px}
.btool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.bcanvas .flowwrap{margin-top:0;background:var(--surface)}
.fnode.editable{touch-action:manipulation;user-select:none;-webkit-touch-callout:none}
.fnode.lifted{transform:scale(1.04);box-shadow:0 10px 26px rgba(0,0,0,.22)!important;z-index:5}
.bcanvas .flowwrap.panning{cursor:grabbing}
.nport{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);border:2px solid var(--violet);cursor:crosshair;z-index:4;touch-action:none}
.nport:hover,.nport:focus-visible{background:var(--violet)}
.fnode.dragging{opacity:.35}
.dragghost{position:fixed;pointer-events:none;z-index:80;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);padding:8px 10px;font-weight:700;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.laneband.drop{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fnode.droptarget{box-shadow:0 0 0 3px var(--violet)}
.flowsvg path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.flowsvg path.selink{stroke:var(--accent)!important;stroke-width:3!important}
.flowsvg path.soft{stroke:var(--muted)!important;stroke-dasharray:2 5!important}
.flowsvg path.same{stroke-dasharray:10 4 2 4}
.flowsvg text.ll{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.relopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px;cursor:pointer}
.relopt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.relopt b{font-size:14px} .relopt span{grid-column:2;font-size:12.5px;color:var(--muted)}
.sugchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugchips button{border:1px dashed color-mix(in srgb,var(--violet) 55%,var(--line));background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.reviewbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--violet) 10%,var(--surface));margin-bottom:10px;font-size:13.5px}
.status{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.status.pending{background:color-mix(in srgb,var(--violet) 14%,var(--surface));color:var(--violet)}
.status.changes{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.status.live{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}

/* Suggestion review: what changed */
.fnode.diff-added{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent)}
.fnode.diff-changed{border-color:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 32%,transparent)}
.fnode.diff-removed{border-style:dashed;border-color:var(--hot);background:color-mix(in srgb,var(--hot) 6%,var(--surface))}
.fnode.diff-removed b{text-decoration:line-through;color:var(--muted)}
.dtag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;color:#fff}
.dtag.added{background:var(--ok)} .dtag.changed{background:var(--warn)} .dtag.removed{background:var(--hot)}
.dnote{font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:6px;padding:3px 6px}
.flowsvg path.ladd{stroke:var(--ok)!important;stroke-width:2.6!important;stroke-dasharray:none!important}
.flowsvg path.lrem{stroke:var(--hot)!important;stroke-dasharray:4 4!important;opacity:.75}
.chg{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13.5px;width:100%}
.chg i{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.chg.on{border-color:var(--accent);background:var(--accent-soft)}
.diffkey{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.diffkey span{display:inline-flex;gap:6px;align-items:center}
.diffkey i{width:12px;height:12px;border-radius:3px;display:inline-block}
.connectbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--violet) 14%,var(--surface));margin-bottom:10px;font-size:14px;font-weight:600}
.fnode.editable{-webkit-user-select:none}
/* Kudos + podium */
.kudo{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.kudo p{margin:4px 0 0;font-size:14.5px}
.kudo small{color:var(--muted)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:8px 0 12px}
.pod{border-radius:14px;background:var(--surface-2);padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .av i{width:34px;height:34px;font-size:12px}

.bwrap{flex:1;min-height:0;position:relative;display:block}

.zoomctl button.zb{width:30px;height:28px;border:0;background:none;font-size:18px;font-weight:700;border-radius:8px}

  .bpanel-head{padding-top:18px}

}
.minimap{position:absolute;right:18px;bottom:18px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:5;cursor:pointer;overflow:hidden}

@media (min-width:1100px){.bwrap.withpanel .minimap{right:408px}}

.page.full .pagebar{display:none}

.navx{display:none}
.flow.compact .fnode .fm,.flow.compact .fnode .ft,.flow.compact .fnode .ntools,.flow.compact .fnode .dnote,.flow.compact .fnode .note{display:none!important}
.flow.compact .navx{display:inline-flex}
.flow.compact .fnode{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
.flow.compact .fnode b{font-size:16px}

.flow.compact .lane .av i{width:30px;height:30px;font-size:12px}
.flow.compact .lane .note{display:none}
.fnode.dim,.scard.dim{opacity:.32}

.flowsvg text.ll.dim{opacity:0}
.steplist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:2px 2px 90px}

/* Later pocket: paper scraps that crumple with each snooze */
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:14px 16px 12px;box-shadow:0 2px 6px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);transform:rotate(var(--rot,0deg));transition:transform .3s}
.paper .ptext{font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.paper .pctx{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.paper .pctx span{font-size:11.5px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--paper-ink) 8%,transparent)}
.paper .pmeta{font-size:12px;opacity:.7;margin-top:6px}
.paper.w1{--rot:-1.2deg;background-image:linear-gradient(118deg,transparent 47%,var(--crease) 49%,transparent 52%)}
.paper.w2{--rot:1.6deg;background-image:linear-gradient(118deg,transparent 47%,var(--crease) 49%,transparent 52%),linear-gradient(32deg,transparent 58%,var(--crease) 60%,transparent 63%),linear-gradient(170deg,transparent 30%,var(--crease) 32%,transparent 35%)}
.paper.w3{--rot:-2.4deg;background-image:linear-gradient(118deg,transparent 47%,var(--crease) 49%,transparent 52%),linear-gradient(32deg,transparent 58%,var(--crease) 60%,transparent 63%),linear-gradient(170deg,transparent 30%,var(--crease) 32%,transparent 35%),linear-gradient(75deg,transparent 20%,var(--crease) 22%,transparent 25%),linear-gradient(140deg,transparent 70%,var(--crease) 72%,transparent 75%);
  clip-path:polygon(0 2%,8% 0,22% 3%,40% 0,61% 2%,80% 0,100% 3%,98% 30%,100% 55%,97% 80%,100% 100%,75% 97%,52% 100%,30% 97%,10% 100%,0 96%,2% 70%,0 45%,3% 20%)}
.paper.w4{--rot:3deg;filter:saturate(.8);background-image:linear-gradient(118deg,transparent 47%,var(--crease) 49%,transparent 52%),linear-gradient(32deg,transparent 58%,var(--crease) 60%,transparent 63%),linear-gradient(170deg,transparent 30%,var(--crease) 32%,transparent 35%),linear-gradient(75deg,transparent 20%,var(--crease) 22%,transparent 25%),linear-gradient(140deg,transparent 70%,var(--crease) 72%,transparent 75%),linear-gradient(10deg,transparent 45%,var(--crease) 47%,transparent 50%),linear-gradient(100deg,transparent 82%,var(--crease) 84%,transparent 87%);
  clip-path:polygon(2% 4%,10% 0,20% 5%,33% 1%,45% 6%,60% 0,72% 5%,86% 1%,100% 6%,96% 22%,100% 38%,95% 55%,100% 72%,96% 88%,100% 100%,84% 95%,70% 100%,55% 94%,40% 100%,26% 95%,12% 100%,0 94%,4% 78%,0 62%,5% 46%,0 30%,4% 15%)}
.paper.tossed{animation:crumple .55s ease-in forwards}
@keyframes crumple{to{transform:scale(.15) rotate(70deg) translateY(120px);opacity:0}}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.laterpop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh,0px) + 70px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));z-index:58;animation:up .3s ease}
.laterpop .actions{margin-top:10px}
.laterpop .paper{--rot:-.8deg}
.paper.w3,.paper.w4{padding:18px 22px 16px}
.laterpop .ptitle{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.wrinkle{display:inline-flex;gap:3px;vertical-align:middle}
.wrinkle i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--paper-ink) 18%,transparent)}
.wrinkle i.on{background:var(--warn)}
/* Light day */
.lightbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.lightbtn.on{background:color-mix(in srgb,var(--rest) 16%,var(--surface));border-color:var(--rest);color:var(--rest)}
.col.lightday{background:color-mix(in srgb,var(--rest) 5%,var(--surface-2))}
.lightnote{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--rest) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--rest) 40%,var(--line));font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Mantras */
.mantra{border-radius:14px;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--violet) 50%,var(--line));background:color-mix(in srgb,var(--violet) 6%,var(--surface));display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;cursor:pointer}
.mantra .ml{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.mantra b{font-family:var(--font-display);font-size:17px;line-height:1.2;grid-column:1}
.mantra > :last-child{grid-row:1/3;grid-column:2}
.mweek{display:flex;gap:6px;flex-wrap:wrap}
.mweek span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.mweek span.on{background:var(--violet);border-color:var(--violet);color:#fff}
.mweek span.today{box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 30%,transparent)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mrow .bar i{background:var(--violet)}
.mrow.cur b{color:var(--violet)}
.bigquote{font-family:var(--font-display);font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:6px 0 10px;text-wrap:balance}
.story{border-left:3px solid var(--violet);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 12px}

/* Reading style: grammar cues + variable weight */
.gv{font-weight:800}
.ga{font-style:italic}
.gn{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-decoration-thickness:.13em;text-underline-offset:.2em;text-decoration-skip-ink:auto}
.gf{font-weight:400;opacity:.72}
html[data-weight="1"] .gw{font-weight:600}
.gpreview{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:15px;line-height:1.5}
/* Focus reader (one phrase at a time) */
.freader{display:grid;place-items:center;min-height:150px;padding:18px 8px;text-align:center;font-size:clamp(24px,6vw,34px);line-height:1.25;font-weight:500;border-radius:16px;background:var(--surface-2);cursor:pointer;user-select:none}
.freader .fprog{height:4px;border-radius:999px;background:var(--line);overflow:hidden;width:100%;margin-top:12px}
.freader .fprog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.readbtn{display:inline-flex;align-items:center;gap:6px}
/* Later timer chips */
.timerchips{display:flex;flex-wrap:wrap;gap:6px}
.ladder{font-size:12.5px;color:var(--muted);margin-top:6px}
.ladder b{color:var(--ink)}

/* Done-so-far drawer on the Now card */
.donetoggle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.donetoggle .arr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);transition:transform .2s;font-size:11px}
.donetoggle[aria-expanded="true"] .arr{transform:rotate(90deg)}
.donelist{display:flex;flex-direction:column;gap:4px;margin:2px 0 4px}
.donelist h5{margin:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.donerow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 8px;border-radius:8px;background:var(--surface-2)}
.donerow span{flex:1;min-width:0;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted)}
.donerow .when{flex:none;text-decoration:none;font-size:12px}
/* Roadblocks */
.chip.block{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 45%,var(--line));background:color-mix(in srgb,var(--hot) 8%,var(--surface))}
.card.has-block{border-color:color-mix(in srgb,var(--hot) 55%,var(--line));border-style:dashed}
.blocknote{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--hot) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--hot) 35%,var(--line));font-size:13.5px}
.blocknote b{color:var(--hot)}
.blocknote .row{margin-top:8px}
.msgprev{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;white-space:pre-line}
.who{display:flex;flex-direction:column;gap:4px}
.who label{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:500;line-height:1.35}
.who input[type=checkbox]{width:20px;height:20px;flex:none;margin:0;padding:0}
.who label > span{min-width:0;overflow-wrap:anywhere}
.who small{color:var(--muted)}

/* Task details: read view */
.tmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:2px 0 10px}
.tmeta b{color:var(--ink);font-weight:600}
.tmeta .ctx{font-weight:600}
.tsec{margin-top:14px}
.tsec > h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tnotes{white-space:pre-line;font-size:14.5px;line-height:1.45}
.tline1{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.tline1 span{flex:1;min-width:0}
.tmore{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.tmore summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tmore[open] summary{margin-bottom:6px}
.tacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tacts .grow{flex:1}
.editbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.editbar h2{margin:0;flex:1}

/* Roadblock: who we're waiting on */
.blkfor{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));margin:4px 0 6px}
.blkfor b{min-width:0;overflow-wrap:anywhere}
.cpick{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow-y:auto;margin-top:6px;padding:2px}
.cpick label{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-size:14px;font-weight:500}
.cpick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cpick input[type=radio]{width:18px;height:18px;flex:none;margin:0;padding:0}
.cpick .cn{flex:1;min-width:0;overflow-wrap:anywhere}
.cpick small{color:var(--muted);display:block;font-size:12px}
.ckind{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ckind.k-Coworker{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ckind.k-Candidate{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 40%,var(--line))}
.ckind.k-Vendor{color:var(--home);border-color:color-mix(in srgb,var(--home) 40%,var(--line))}
.ckind.k-Client{color:var(--work);border-color:color-mix(in srgb,var(--work) 40%,var(--line))}
.blkwho{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px}
.blkwho span b{color:var(--ink)}

/* ---------- Lock screen preview (Live Activity, Dynamic Island, Watch) ---------- */
.lockwrap{position:fixed;inset:0;z-index:95;background:rgba(6,8,14,.9);display:flex;align-items:center;justify-content:center;gap:32px;overflow:auto;padding:16px}
.lockphone{position:relative;flex:none;width:min(390px,100%);height:min(800px,calc(100dvh - 32px));border-radius:46px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 20% 15%,#3B4FD8 0,transparent 45%),radial-gradient(circle at 85% 60%,#B04A8F 0,transparent 45%),radial-gradient(circle at 30% 95%,#1E9E8A 0,transparent 50%),#0F1226;
  box-shadow:0 0 0 10px #0b0c10,0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;padding:12px 16px 18px;font-family:var(--font-body)}

.lockdate{font-size:17px;font-weight:600;opacity:.85;margin-top:6px}
.lockstack{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:12px 14px}
.lnote{display:flex;gap:10px;align-items:flex-start;font-size:14px}

.lnote.warnc{background:rgba(242,192,75,.22);border-color:rgba(242,192,75,.5)}
.live{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.lring{--p:0;--rc:#8FA2FF;position:relative;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*360deg),rgba(255,255,255,.16) 0);flex:none}
.lring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#171a30}
.lring b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:17px;font-variant-numeric:tabular-nums}

.lring.over{--rc:#F2C04B}
.live .lt{font-size:16px;font-weight:700;line-height:1.2}
.live .ls{font-size:13px;opacity:.8;margin-top:3px}
.live .lb{display:flex;gap:8px;margin-top:8px}
.live .lb button{border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;min-height:36px}
.live .lb button.go{background:#fff;color:#151830}
.lnext{font-size:13px;opacity:.85;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14)}
.lockbar{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px}
.lockbar .round{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.lockbar .round svg{width:20px;height:20px}
.unlock{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.lockside{display:flex;flex-direction:column;gap:18px;align-items:center;color:#d8dcef;max-width:260px}
.watch{width:168px;height:200px;border-radius:44px;background:#000;box-shadow:0 0 0 8px #24262d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:14px}
.watch .lring{width:96px;height:96px}.watch .lring::after{background:#000;inset:9px}
.watch small{font-size:12px;opacity:.8;line-height:1.2}
.lockside p{font-size:13.5px;line-height:1.45;margin:0}
@media (max-width:760px){.lockside{display:none}.lockwrap{padding:0}.lockphone{border-radius:0;height:100dvh;width:100%;box-shadow:none}}

/* ---------- Rewards ---------- */
.surprise{position:fixed;left:50%;bottom:calc(var(--tabh,0px) + 84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;width:min(380px,calc(100vw - 32px));
  border-radius:18px;padding:14px 16px;color:#1d1a08;background:linear-gradient(135deg,#FFE9A8,#FFD166 55%,#FFB703);box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;animation:surpriseIn .5s cubic-bezier(.2,1.4,.4,1)}
.surprise .sic{width:42px;height:42px;border-radius:50%;background:#fff8;display:grid;place-items:center;flex:none}
.surprise .sic svg{width:24px;height:24px}
.surprise b{display:block;font-size:16px}
.surprise span{font-size:13.5px}
.surprise.comeback{background:linear-gradient(135deg,#C8F2E2,#7FDDB8 60%,#3CCB8A);color:#08261a}
.surprise.out{animation:surpriseOut .35s ease forwards}
@keyframes surpriseIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
@keyframes surpriseOut{to{opacity:0;transform:translate(-50%,20px)}}
.trail{display:flex;align-items:flex-end;gap:0;margin:10px 0 4px;overflow-x:auto;padding:6px 2px}
.trail .tn{flex:1 0 54px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--muted)}
.trail .tn::before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0}
.trail .tn:first-child::before{display:none}
.trail .tn.lit::before{background:var(--ok)}
.trail .dot2{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-2);border:2px solid var(--line);color:var(--muted)}
.trail .lit .dot2{background:var(--ok);border-color:var(--ok);color:#fff}
.trail .today .dot2{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
.jarrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.jar{position:relative;width:74px;height:96px;border:3px solid color-mix(in srgb,var(--ink) 35%,transparent);border-top-width:8px;border-radius:12px 12px 22px 22px;overflow:hidden;background:var(--surface-2)}
.jar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#FFD166,#F4A261);transition:height .6s}
.jar b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;z-index:1}
.treat{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.treat:last-child{border-bottom:0}
.treat span{flex:1;min-width:0}
.treat small{color:var(--muted)}
.packs{display:flex;flex-direction:column;gap:6px}
.pack{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.pack[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.pack:disabled{opacity:.55;cursor:default}
.pack span{flex:1}
.pack small{color:var(--muted)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.stk{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:12px;font-weight:600}
.stk .disc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.35)}
.stk .disc svg{width:26px;height:26px}
.stk.locked .disc{background:var(--surface-2)!important;color:var(--muted);box-shadow:none;border:2px dashed var(--line)}
.stk small{font-weight:500;color:var(--muted);line-height:1.25}
.pairhint{font-size:13px;color:var(--violet);font-weight:600}

/* ---------- First-week onboarding ---------- */
.obwrap{position:fixed;inset:0;z-index:96;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.obcard{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.obdots{display:flex;gap:6px}
.obdots i{height:6px;flex:1;border-radius:999px;background:var(--line)}
.obdots i.on{background:var(--accent)}
.obcard h1{font-family:var(--font-display);font-size:clamp(28px,7vw,38px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 0}
.obcard .lede2{font-size:17px;color:var(--muted);margin:0}
.obopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.obopt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:56px}
.obopt b{display:block;font-size:15px}
.obopt small{color:var(--muted)}
.obopt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.obthing{display:flex;gap:8px;align-items:center}
.obthing input{flex:1;min-width:0;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.obthing .seg button{padding:6px 10px}
.obfoot{display:flex;gap:10px;align-items:center;margin-top:6px}
.obfoot .skip{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;min-height:44px}
.obplan{display:flex;flex-direction:column;gap:6px}
.obplan div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.obplan div small{margin-left:auto;color:var(--muted);font-weight:500}
.unlocknote{font-size:13px;color:var(--muted)}
/* ---------- Today isn't working ---------- */
.resetlink{align-self:flex-start;background:none;border:0;padding:2px 0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px}
.keeplist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.keeplist label{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-weight:500;font-size:14.5px}
.keeplist label:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.keeplist input{width:20px;height:20px;flex:none;margin:0}
.keeplist span{flex:1;min-width:0}
.keeplist small{display:block;color:var(--muted);font-size:12px}

/* ---------- When-then plans ---------- */
.whenline{grid-column:1/-1;font-size:12.5px;color:var(--violet);font-weight:600;display:flex;gap:5px;align-items:center;line-height:1.3}
.whenline svg{width:13px;height:13px;flex:none}
.whensentence{border-radius:12px;padding:9px 11px;background:color-mix(in srgb,var(--violet) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--violet) 30%,var(--line));font-size:14px;line-height:1.4}
.whensentence b{color:var(--violet)}
.plannudge{grid-column:1/-1;justify-self:start;background:none;border:0;padding:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--violet);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:28px}
.cueopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cueopts button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;min-height:48px}
.cueopts button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.cueopts button[aria-pressed=true]{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--surface))}
.whenpop{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:72;width:min(420px,calc(100vw - 32px));border-radius:18px;padding:14px 16px;background:var(--surface);border:2px solid var(--violet);box-shadow:0 14px 34px rgba(0,0,0,.25);animation:up .3s ease}
.whenpop .lab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.whenpop p{margin:4px 0 10px;font-size:15.5px;line-height:1.4}
/* ---------- Weekly review ---------- */
.rvlist{display:flex;flex-direction:column;gap:8px}
.rvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rvrow > span{flex:1 1 180px;min-width:0;font-weight:600}
.rvrow > span small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.rvrow.decided{opacity:.6}
.toprow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.toprow .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.toprow input,.toprow select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%}
.toprow .whenrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.toprow .whenrow select{flex:1 1 120px;width:auto}
.weektop{border-radius:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.weektop .ml{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.weektop div{display:flex;gap:8px;align-items:center;font-size:14px}
.weektop div.done span{text-decoration:line-through;color:var(--muted)}
.weektop i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.weektop div.done i{background:var(--ok);border-color:var(--ok)}
.reviewcard{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reviewcard span{flex:1 1 180px;font-size:14px}

/* ---------- Lock screen: Later pocket widget + quick jot ---------- */
.lockwidgets{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.lwid{display:flex;align-items:center;gap:7px;border:0;border-radius:18px;padding:9px 13px;background:rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;min-height:44px}
.lwid svg{width:17px;height:17px}
.lwid.jot{background:rgba(255,255,255,.92);color:#151830}
.lwid small{font-weight:600;opacity:.75}
.lockjot{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;border-radius:26px;padding:14px;background:rgba(24,27,48,.9);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:10px;animation:up .25s ease}
.lockjot h4{margin:0;font-size:16px;color:#fff}
.lockjot textarea{width:100%;min-height:84px;resize:vertical;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:16px;padding:10px 12px}
.lockjot textarea::placeholder{color:rgba(255,255,255,.55)}
.ljchips{display:flex;flex-wrap:wrap;gap:6px}
.ljchips button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.ljchips button[aria-pressed=true]{background:#fff;color:#151830;border-color:#fff}
.lockjot .lab2{font-size:12px;font-weight:700;opacity:.75;color:#fff}
.lockjot .ctxline{font-size:12px;opacity:.7;color:#fff}
.lockjot .row2{display:flex;gap:8px}
.lockjot .row2 button{flex:1;border:0;border-radius:999px;padding:11px;font:inherit;font-weight:800;cursor:pointer;min-height:44px}
.lockjot .save{background:#fff;color:#151830}
.lockjot .cancel{background:rgba(255,255,255,.16);color:#fff}
.lockdone{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;background:rgba(255,255,255,.92);color:#151830;border-radius:20px;padding:14px 18px;font-weight:700;text-align:center;width:min(300px,80%);animation:up .25s ease}
.lockdone small{display:block;font-weight:500;opacity:.75;margin-top:2px}
/* ---------- Focus rooms ---------- */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.room{border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.room h3{margin:0;font-size:17px}
.room p{margin:0;font-size:13.5px;color:var(--muted)}
.room .faces{display:flex}
.room .faces span{width:28px;height:28px;border-radius:50%;margin-right:-6px;border:2px solid var(--surface);display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok)}
.livedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.roomhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.roomring{--p:0;position:relative;width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--pie-track) 0)}
.roomring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
.roomring b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:26px;font-variant-numeric:tabular-nums}
.roomring small{position:absolute;left:0;right:0;top:64%;text-align:center;z-index:1;font-size:11.5px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.person{border-radius:14px;padding:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:96px;position:relative}
.person .pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.person b{font-size:13.5px}
.person small{font-size:12px;color:var(--muted);line-height:1.3}
.person.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.person.flash{animation:flash 1.2s ease}
@keyframes flash{30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 45%,transparent)}}
.person .react{position:absolute;right:8px;top:8px;font-size:12px;font-weight:800;color:var(--ok)}
/* ---------- Distraction shield ---------- */
.shieldchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface));cursor:pointer}
.shieldchip.off{color:var(--muted);border-color:var(--line);background:var(--surface)}
.shieldchip svg{width:14px;height:14px}
.appchips{display:flex;flex-wrap:wrap;gap:6px}
.shieldwrap{position:fixed;inset:0;z-index:97;display:flex;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#1B2140,#0E1222);color:#fff;text-align:center}
.shieldbox{max-width:380px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.shieldbox .big{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.shieldbox .big svg{width:42px;height:42px}
.shieldbox h2{margin:0;font-size:26px;line-height:1.15}
.shieldbox p{margin:0;font-size:16px;opacity:.85;line-height:1.45}
.shieldbox .breath{width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:30px;font-weight:700;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);border-color:rgba(255,255,255,.8)}}
.shieldbox .sbtn{width:100%;border:0;border-radius:999px;padding:13px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}
.shieldbox .sbtn.main{background:#fff;color:#151830}
.shieldbox .sbtn.alt{background:rgba(255,255,255,.16);color:#fff}
.shieldbox .sbtn:disabled{opacity:.45;cursor:default}
.shieldbox small{opacity:.65;font-size:12.5px}

/* ---------- Shield breathing guide ---------- */
.breathe2{position:relative;width:170px;height:170px;display:grid;place-items:center}
.breathe2 .orb{position:absolute;inset:0;margin:auto;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(160,190,255,.55),rgba(90,120,255,.25) 60%,rgba(90,120,255,.08));box-shadow:0 0 40px rgba(120,150,255,.35);transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.breathe2 .ring2{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.85) calc(var(--p,0)*360deg),rgba(255,255,255,.14) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.breathe2 b{position:relative;z-index:1;font-size:16px;font-weight:700;text-align:center;line-height:1.25;max-width:120px}
.breathe2 b small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:2px}
/* ---------- Energy and medication check-in ---------- */
.ci{border-radius:14px;padding:12px;border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--surface));display:flex;flex-direction:column;gap:9px}
.ci .cih{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ci .cih b{font-size:15px}
.ci .cih small{color:var(--muted);font-size:12px}
.ci .q{font-size:13px;font-weight:700;color:var(--muted)}
.ci .opts{display:flex;flex-wrap:wrap;gap:5px}
.ci .opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;min-height:34px}
.ci .opts button[aria-pressed=true]{border-color:var(--ok);background:var(--ok);color:#fff}
.ci .lvl{display:flex;gap:4px}
.ci .lvl button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;min-height:40px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ci .lvl button i{display:block;width:6px;border-radius:3px;background:var(--ok)}
.ci .lvl button[aria-pressed=true]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.ci.donec{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:8px 12px;font-size:13px}
.ci.donec span{flex:1 1 200px}
.ci .suggest{border-radius:10px;padding:8px 10px;background:var(--surface);border:1px dashed var(--line);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edots{display:flex;gap:8px;margin:10px 0}
.edots div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.edots .bar3{width:100%;height:60px;border-radius:8px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.edots .bar3 i{display:block;width:100%;background:var(--ok);border-radius:8px 8px 0 0}

/* ---------- When-then plans (implementation intentions) ---------- */

function whenDraft(){ const w = S._when; return w.type === 'after' ? {type:'after', taskId:w.taskId} : w.type === 'time' ? {type:'time', time:w.time} : w.type === 'own' ? {type:'own', text:w.text} : {type:w.type}; }

// Breathing guide: exhale-focused "cyclic sighs" (in through the nose, a short extra sip, a long slow exhale).
// 15 s = two sighs; 10 s = one slow 4-in / 6-out breath; 30 s = four sighs.
function breathPlan(total){
  if (total <= 10) return [['in', 4, 'Breathe in', 'through your nose'], ['out', 6, 'Slowly out', 'through your mouth']];
  const sigh = [['in', 2, 'Breathe in', 'through your nose'], ['sip', 1, 'Sip in a little more', ''], ['out', 4.5, 'Long, slow exhale', 'let your shoulders drop']];
  const n = Math.round(total / 7.5); let plan = []; for (let i = 0; i < n; i++) plan = plan.concat(sigh); return plan;
}
function breatheGuide(total, done){
  const plan = breathPlan(total), sum = plan.reduce((a, x) => a + x[1], 0), t0 = performance.now(); let i = 0;
  const orb = () => $('#shOrb'), ring = () => $('#shRing'), ph = () => $('#shPhase');
  const step = () => {
    if (!orb()) return;
    if (i >= plan.length){ orb().style.transitionDuration = '1s'; orb().style.transform = 'scale(.7)'; ph().innerHTML = 'Done<small>How do you feel?</small>'; ring().style.setProperty('--p', 1); done && done(); return; }
    const [kind, sec, label, sub] = plan[i++], reduce = !motionOK();
    orb().style.transitionDuration = reduce ? '0s' : sec + 's';

// Shield pitch: lead with the strongest true reason to go back, based on where the person is in the task.
function shieldPitch(t, app){
  if (!t) return {head:'Your focus time is on', sub:'The urge usually fades within a minute. Breathe with the circle.', cta:'Back to my task', pct:0, next:''};
  const e = estOf(t), sp = t.spent || 0, left = Math.max(0, Math.ceil(e - sp)), done = stepsDone(t), total = t.steps.length, ns = nextStep(t);
  const stepPct = total ? done / total : 0, timePct = Math.min(1, sp / e), pct = Math.round(100 * Math.max(stepPct, total ? 0 : timePct));
  const earn = TASK_EARN[t.diff] || 3, bank = appBank(), dueToday = t.due != null && t.due <= S.day, ns2 = ns ? ns.t : '';
  const cta = left > 0 && left <= 30 ? 'Back to it: ' + left + ' min to go' : ns ? 'Back to it: next step' : 'Back to it: finish up';
  let head, sub;
  if (total && done === total){ head = 'You\'re done. Just tap Complete.'; sub = 'Every step is checked. One tap and "' + t.title + '" is off your plate.'; }
  else if (total && total - done === 1){ head = 'One step left.'; sub = 'Finish it and "' + t.title + '" is done.'; }
  else if (bank < BANK_GOAL && bank + earn >= BANK_GOAL){ head = 'Finish this and ' + app + ' is yours for 15 minutes.'; sub = 'This task tops your app-time bank up to 15 minutes, guilt-free, no shield.'; }
  else if (pct >= 60){ head = pct >= 80 || (left && left <= 15) ? 'You\'re ' + pct + '% there. So close.' : 'More than halfway there.'; sub = (total ? done + ' of ' + total + ' steps done' : fmtDur(sp) + ' in') + (left ? ', about ' + left + ' min left.' : '.'); }
  else if (sp < 4){ head = 'You just started. That was the hardest part.'; sub = 'Starting is where most of the effort goes, and you already did it. Give it five more minutes.'; }
  else if (sp >= 10){ head = Math.round(sp) + ' minutes in. Don\'t lose that momentum.'; sub = 'Switching away now means warming back up later. Keep it rolling.'; }
  else { head = 'You\'re already rolling on this.'; sub = left ? 'About ' + left + ' min left on your estimate.' : 'Stay with it a little longer.'; }
  if (dueToday && !/done/.test(head)) sub += ' It\'s due today, so finishing now takes it off your mind.';
  else if (bank < BANK_GOAL && !/15 minutes/.test(head)) sub += ' Finishing adds ' + earn + ' min to your app time.';
  return {head, sub, cta, pct, last:total - done === 1, next:total && done < total && total - done > 1 ? ns2 : (total - done === 1 ? ns2 : '')};
}

    return m.type === 'same' ? effectiveAfter(stages, src, seen) : [a]; }))];
}

function aiSteps(title){
  const s = title.toLowerCase();

  if (/agreement|contract/.test(s)) return TEMPLATES.agreement.steps;
  if (/onboard|nurse|hire/.test(s)) return TEMPLATES.onboard.steps;
  if (/bill|missing time|invoice/.test(s)) return TEMPLATES.billing.steps;
  return [['Decide the first 5-minute action'],['Gather what you need'],['Do the main work'],['Check it against "done when"']];
}
function aiDone(title){

  if (/agreement|contract/.test(s)) return 'Agreement sent and signed';

  return 'The result exists and you can show it to someone';
}
